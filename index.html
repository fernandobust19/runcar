<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RunCar - Puzzle de Carreteras</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            touch-action: manipulation;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        canvas {
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            border-radius: 10px;
            background-color: #1e293b;
            border: 2px solid #334155;
            cursor: pointer;
        }
        .btn-game { transition: all 0.1s; -webkit-tap-highlight-color: transparent; }
        .btn-game:active { transform: scale(0.95); }
        .shake { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-5px, 0, 0); }
            40%, 60% { transform: translate3d(5px, 0, 0); }
        }
        .pulse { animation: pulse 0.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .timer-warning { animation: timerPulse 0.5s infinite; color: #ef4444 !important; }
        @keyframes timerPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        .progress-bar { transition: width 1s linear; }
        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        input[type="text"] {
            background: #1e293b; border: 2px solid #475569; color: white;
            padding: 12px 16px; border-radius: 10px; font-size: 18px;
            width: 100%; max-width: 280px; text-align: center;
        }
        input[type="text"]:focus { outline: none; border-color: #10b981; }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="h-screen w-screen flex flex-col items-center justify-center overflow-hidden">

    <!-- PANTALLA DE INICIO -->
    <div id="startScreen" class="absolute inset-0 bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 flex flex-col items-center justify-center z-50 p-4">
        <div class="text-center fade-in">
            <div class="text-6xl mb-4">🚗</div>
            <h1 class="text-4xl font-bold text-emerald-400 mb-2">RunCar</h1>
            <p class="text-slate-400 mb-8">Puzzle de Carreteras</p>
            <div class="mb-6">
                <label class="block text-slate-300 mb-2 text-sm">Nombre del conductor:</label>
                <input type="text" id="driverName" placeholder="Tu nombre" maxlength="15" autocomplete="off">
            </div>
            <button onclick="startGame()" class="btn-game bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-4 px-12 rounded-xl text-xl shadow-lg border-b-4 border-emerald-800">
                🏁 JUGAR
            </button>
            <div class="mt-8 text-slate-500 text-xs max-w-xs">
                <p>⚠️ ¡Cuidado! Hay varias metas falsas.<br>Solo una ruta es la correcta.</p>
            </div>
        </div>
    </div>

    <!-- Header -->
    <div class="absolute top-0 w-full p-2 flex justify-between items-center pointer-events-none z-10">
        <div class="bg-slate-800/95 px-3 py-1.5 rounded-lg border border-slate-600 shadow-lg">
            <p class="text-emerald-400 font-bold text-sm">🚗 <span id="driverDisplay">Conductor</span></p>
            <p class="text-xs text-slate-400">Nivel <span id="levelDisplay">1</span>/40</p>
        </div>
        <div class="bg-slate-800/95 px-3 py-1.5 rounded-lg border border-slate-600 shadow-lg flex flex-col items-center">
            <span id="statusText" class="text-yellow-400 font-bold text-xs">GIRA LAS FICHAS</span>
            <div class="w-24 h-1.5 bg-slate-700 rounded-full mt-1 overflow-hidden">
                <div id="progressBar" class="progress-bar h-full bg-emerald-500 rounded-full" style="width: 100%"></div>
            </div>
        </div>
        <div class="bg-slate-800/95 px-3 py-1.5 rounded-lg border border-slate-600 shadow-lg">
            <span id="timerDisplay" class="text-blue-400 font-bold text-lg">⏱️ 30</span>
        </div>
    </div>

    <!-- Game Area -->
    <div class="relative p-1" id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <div id="overlay" class="hidden absolute inset-0 bg-black/90 flex flex-col items-center justify-center z-20 backdrop-blur-sm rounded-xl p-4">
            <div class="text-6xl mb-3 animate-bounce" id="overlayIcon">🏆</div>
            <h2 class="text-2xl font-bold mb-1 text-white text-center" id="overlayTitle"></h2>
            <p class="text-slate-300 text-sm mb-1 text-center" id="overlaySubtitle"></p>
            <p class="text-yellow-400 text-xs mb-4" id="overlayBonus"></p>
            <button id="overlayBtn" class="bg-emerald-500 hover:bg-emerald-400 text-white font-bold py-3 px-8 rounded-full shadow-lg btn-game">Siguiente</button>
        </div>
    </div>

    <!-- Hint -->
    <div class="text-center text-slate-400 text-xs mt-1 px-4">
        <p id="levelHint">⚠️ ¡Varias rutas, solo una correcta!</p>
    </div>

    <!-- Controls -->
    <div class="absolute bottom-3 w-full flex justify-center gap-2 px-3 pointer-events-auto z-10">
        <button onclick="resetLevel()" class="btn-game bg-slate-600 hover:bg-slate-500 text-white p-3 rounded-xl shadow-lg border-b-4 border-slate-800">🔄</button>
        <button onclick="startCar()" id="btnStart" class="btn-game bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-8 rounded-xl text-base shadow-lg border-b-4 border-emerald-800">🚗 ARRANCAR</button>
        <button onclick="toggleSound()" id="btnSound" class="btn-game bg-blue-600 hover:bg-blue-500 text-white p-3 rounded-xl shadow-lg border-b-4 border-blue-800"><span id="soundIcon">🔊</span></button>
        <button onclick="showMenu()" class="btn-game bg-purple-600 hover:bg-purple-500 text-white p-3 rounded-xl shadow-lg border-b-4 border-purple-800">☰</button>
    </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Audio
let audioCtx = null, soundEnabled = true;
function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
function playSound(type) {
    if (!soundEnabled || !audioCtx) return;
    try {
        const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        const t = audioCtx.currentTime;
        if (type === 'rotate') { osc.frequency.setValueAtTime(600, t); osc.frequency.exponentialRampToValueAtTime(300, t + 0.08); gain.gain.setValueAtTime(0.08, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.08); osc.start(t); osc.stop(t + 0.08); }
        else if (type === 'engine') { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(80, t); gain.gain.setValueAtTime(0.05, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.15); osc.start(t); osc.stop(t + 0.15); }
        else if (type === 'crash') { osc.type = 'square'; osc.frequency.setValueAtTime(150, t); osc.frequency.exponentialRampToValueAtTime(40, t + 0.25); gain.gain.setValueAtTime(0.2, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.25); osc.start(t); osc.stop(t + 0.25); }
        else if (type === 'win') { [523,659,784,1047].forEach((f,i) => { const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.connect(g); g.connect(audioCtx.destination); o.frequency.setValueAtTime(f, t+i*0.12); g.gain.setValueAtTime(0.12, t+i*0.12); g.gain.exponentialRampToValueAtTime(0.01, t+i*0.12+0.2); o.start(t+i*0.12); o.stop(t+i*0.12+0.2); }); }
        else if (type === 'warning') { osc.frequency.setValueAtTime(500, t); gain.gain.setValueAtTime(0.1, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.15); osc.start(t); osc.stop(t + 0.15); }
    } catch(e) {}
}
function toggleSound() { soundEnabled = !soundEnabled; document.getElementById('soundIcon').textContent = soundEnabled ? '🔊' : '🔇'; }

// Niveles
const LEVEL_CONFIG = [];
for (let i = 1; i <= 40; i++) {
    const cols = Math.min(4 + Math.floor(i / 6), 7);
    const rows = Math.min(5 + Math.floor(i / 5), 9);
    const time = 40 + i * 2;
    const speed = 2.2 + i * 0.1;
    const numEnds = Math.min(1 + Math.floor(i / 5), 3); // 1-3 metas falsas
    const numExits = Math.min(2 + Math.floor(i / 10), 3); // 2-3 salidas del inicio
    const obstacles = Math.floor(i / 6);
    let features = [];
    if (i >= 8) features.push('semaphore');
    if (i >= 15) features.push('puddle');
    if (i >= 22) features.push('boost');
    LEVEL_CONFIG.push({ cols, rows, time, speed, numEnds, numExits, obstacles, features });
}

// Variables
let TILE_SIZE = 60, COLS = 5, ROWS = 6;
const DIR = { N: 1, E: 2, S: 4, W: 8 };
const DIR_DELTA = { 1: {dc:0,dr:-1}, 2: {dc:1,dr:0}, 4: {dc:0,dr:1}, 8: {dc:-1,dr:0} };
const OPPOSITE = { 1: 4, 2: 8, 4: 1, 8: 2 };

const TILE_TYPES = {
    STRAIGHT: { id: 1, base: DIR.N | DIR.S },
    CURVE: { id: 2, base: DIR.N | DIR.E },
    T_JUNCTION: { id: 3, base: DIR.N | DIR.E | DIR.S },
    CROSS: { id: 4, base: DIR.N | DIR.E | DIR.S | DIR.W },
    START: { id: 5, base: DIR.E | DIR.S, locked: true }, // Múltiples salidas
    END_REAL: { id: 6, base: DIR.W, locked: true },
    END_FAKE: { id: 7, base: DIR.W, locked: true },
    BLOCKED: { id: 8, base: 0, locked: true }
};

let grid = [], specialTiles = [], car = null, level = 1, driverName = "Conductor";
let gameState = 'START', animationId, countdownTimer, timeLeft, maxTime, engineSoundInterval;
let correctPath = [], realEndPos = null;

const $ = id => document.getElementById(id);

// Clase Tile
class Tile {
    constructor(col, row, type, rotation = 0) {
        this.col = col; this.row = row; this.type = type;
        this.rotation = rotation; this.locked = type.locked || false;
        this.powered = false; this.special = null; this.semaphoreState = 'red';
    }
    getConnections() {
        if (this.type === TILE_TYPES.BLOCKED) return 0;
        let conn = this.type.base;
        for (let i = 0; i < this.rotation; i++) {
            let n = 0;
            if (conn & DIR.N) n |= DIR.E;
            if (conn & DIR.E) n |= DIR.S;
            if (conn & DIR.S) n |= DIR.W;
            if (conn & DIR.W) n |= DIR.N;
            conn = n;
        }
        return conn;
    }
}

// Inicio
function startGame() {
    initAudio();
    driverName = $('driverName').value.trim() || "Conductor";
    $('driverDisplay').textContent = driverName;
    $('startScreen').classList.add('hidden');
    level = 1; $('levelDisplay').textContent = level;
    generateLevel();
}

function showMenu() {
    if (confirm('¿Volver al menú?')) {
        cancelAnimationFrame(animationId);
        clearInterval(countdownTimer);
        clearInterval(engineSoundInterval);
        $('startScreen').classList.remove('hidden');
        gameState = 'START';
    }
}

function init() {
    resize();
    window.addEventListener('resize', () => { if (gameState !== 'START') { resize(); draw(); } });
    canvas.addEventListener('pointerdown', handleClick);
}

function resize() {
    const config = LEVEL_CONFIG[Math.min(level - 1, 39)];
    COLS = config.cols; ROWS = config.rows;
    TILE_SIZE = Math.min(Math.floor((innerWidth - 20) / COLS), Math.floor((innerHeight - 170) / ROWS), 65);
    canvas.width = COLS * TILE_SIZE; canvas.height = ROWS * TILE_SIZE;
}

function handleClick(e) {
    initAudio();
    if (gameState !== 'EDITING') return;
    const rect = canvas.getBoundingClientRect();
    const col = Math.floor((e.clientX - rect.left) / TILE_SIZE);
    const row = Math.floor((e.clientY - rect.top) / TILE_SIZE);
    if (col >= 0 && col < COLS && row >= 0 && row < ROWS) {
        const tile = grid[row * COLS + col];
        if (tile && !tile.locked && tile.type !== TILE_TYPES.BLOCKED) {
            tile.rotation = (tile.rotation + 1) % 4;
            playSound('rotate');
            checkConnections();
            draw();
        }
    }
}

function resetLevel() {
    cancelAnimationFrame(animationId);
    clearInterval(countdownTimer);
    clearInterval(engineSoundInterval);
    generateLevel();
}

function generateLevel() {
    const config = LEVEL_CONFIG[Math.min(level - 1, 39)];
    gameState = 'EDITING';
    $('overlay').classList.add('hidden');
    $('btnStart').classList.remove('opacity-50', 'pointer-events-none');
    
    maxTime = config.time; timeLeft = maxTime;
    $('timerDisplay').textContent = `⏱️ ${timeLeft}`;
    $('timerDisplay').classList.remove('timer-warning');
    $('progressBar').style.width = '100%';
    $('progressBar').className = 'progress-bar h-full bg-emerald-500 rounded-full';
    $('statusText').textContent = 'GIRA LAS FICHAS';
    $('statusText').className = 'text-yellow-400 font-bold text-xs';
    $('levelHint').textContent = `⚠️ ${config.numEnds + 1} metas - ¡Solo 1 es real!`;
    
    resize();
    grid = new Array(COLS * ROWS).fill(null);
    specialTiles = []; correctPath = []; realEndPos = null;
    
    // 1. Colocar obstáculos
    placeObstacles(config.obstacles);
    
    // 2. Colocar inicio con múltiples salidas
    placeStart(config.numExits);
    
    // 3. Colocar metas (1 real + falsas)
    placeEnds(config.numEnds);
    
    // 4. Generar camino correcto
    generateCorrectPath();
    
    // 5. Generar caminos falsos hacia metas falsas
    generateFakePaths();
    
    // 6. Rellenar espacios vacíos
    fillEmpty();
    
    // 7. Aleatorizar rotaciones
    randomizeRotations();
    
    // 8. Elementos especiales
    addSpecials(config.features);
    
    resetCar();
    checkConnections();
    draw();
    startCountdown();
}

function placeObstacles(count) {
    let placed = 0, attempts = 0;
    while (placed < count && attempts < 100) {
        attempts++;
        const col = 1 + Math.floor(Math.random() * (COLS - 2));
        const row = 1 + Math.floor(Math.random() * (ROWS - 2));
        if (!grid[row * COLS + col]) {
            const tile = new Tile(col, row, TILE_TYPES.BLOCKED);
            tile.special = ['broken', 'tree', 'construction'][Math.floor(Math.random() * 3)];
            grid[row * COLS + col] = tile;
            placed++;
        }
    }
}

function placeStart(numExits) {
    // Inicio en esquina superior izquierda
    const startType = { ...TILE_TYPES.START };
    // Configurar salidas según nivel
    if (numExits >= 3) startType.base = DIR.E | DIR.S | DIR.N;
    else if (numExits >= 2) startType.base = DIR.E | DIR.S;
    else startType.base = DIR.E;
    
    const tile = new Tile(0, 0, startType);
    tile.locked = true;
    grid[0] = tile;
}

function placeEnds(numFake) {
    // Meta real en esquina inferior derecha
    realEndPos = { col: COLS - 1, row: ROWS - 1 };
    const realEnd = new Tile(COLS - 1, ROWS - 1, TILE_TYPES.END_REAL);
    realEnd.locked = true;
    grid[(ROWS - 1) * COLS + (COLS - 1)] = realEnd;
    
    // Metas falsas en otros bordes
    const fakePositions = [
        { col: COLS - 1, row: 0 },           // Esquina superior derecha
        { col: COLS - 1, row: Math.floor(ROWS / 2) }, // Mitad derecha
        { col: Math.floor(COLS / 2), row: ROWS - 1 }  // Mitad inferior
    ];
    
    for (let i = 0; i < numFake && i < fakePositions.length; i++) {
        const pos = fakePositions[i];
        if (!grid[pos.row * COLS + pos.col]) {
            const fakeEnd = new Tile(pos.col, pos.row, TILE_TYPES.END_FAKE);
            fakeEnd.locked = true;
            // Orientar hacia donde viene el camino
            if (pos.col === COLS - 1) fakeEnd.rotation = 0; // Entrada desde izquierda
            else fakeEnd.rotation = 3; // Entrada desde arriba
            grid[pos.row * COLS + pos.col] = fakeEnd;
        }
    }
}

function generateCorrectPath() {
    // BFS desde inicio hasta meta real
    const start = { col: 0, row: 0 };
    const end = realEndPos;
    const blocked = new Set();
    
    grid.forEach((t, i) => {
        if (t && t.type === TILE_TYPES.BLOCKED) {
            blocked.add(`${i % COLS},${Math.floor(i / COLS)}`);
        }
    });
    
    const queue = [[start]];
    const visited = new Set([`${start.col},${start.row}`]);
    
    while (queue.length > 0) {
        const path = queue.shift();
        const curr = path[path.length - 1];
        
        if (curr.col === end.col && curr.row === end.row) {
            correctPath = path;
            break;
        }
        
        const moves = [
            { col: curr.col + 1, row: curr.row },
            { col: curr.col, row: curr.row + 1 },
            { col: curr.col - 1, row: curr.row },
            { col: curr.col, row: curr.row - 1 }
        ].sort(() => Math.random() - 0.3);
        
        for (const m of moves) {
            const key = `${m.col},${m.row}`;
            if (m.col >= 0 && m.col < COLS && m.row >= 0 && m.row < ROWS &&
                !visited.has(key) && !blocked.has(key)) {
                visited.add(key);
                queue.push([...path, m]);
            }
        }
    }
    
    // Colocar tiles del camino correcto
    for (let i = 1; i < correctPath.length - 1; i++) {
        const { col, row } = correctPath[i];
        if (grid[row * COLS + col]) continue;
        
        const prev = correctPath[i - 1];
        const next = correctPath[i + 1];
        const tile = createPathTile(col, row, prev, next);
        grid[row * COLS + col] = tile;
    }
}

function generateFakePaths() {
    // Generar caminos hacia metas falsas desde el inicio
    const fakeEnds = [];
    grid.forEach((t, i) => {
        if (t && t.type === TILE_TYPES.END_FAKE) {
            fakeEnds.push({ col: i % COLS, row: Math.floor(i / COLS) });
        }
    });
    
    for (const fakeEnd of fakeEnds) {
        // Camino parcial que se desvía
        const pathLength = Math.floor(Math.min(COLS, ROWS) * 0.6);
        let curr = { col: 0, row: 0 };
        
        for (let i = 0; i < pathLength; i++) {
            // Moverse hacia la meta falsa
            const moves = [];
            if (curr.col < fakeEnd.col) moves.push({ col: curr.col + 1, row: curr.row });
            if (curr.row < fakeEnd.row) moves.push({ col: curr.col, row: curr.row + 1 });
            if (curr.row > fakeEnd.row) moves.push({ col: curr.col, row: curr.row - 1 });
            
            if (moves.length === 0) break;
            
            const next = moves[Math.floor(Math.random() * moves.length)];
            if (!grid[next.row * COLS + next.col] && 
                !correctPath.some(p => p.col === next.col && p.row === next.row)) {
                // Colocar tile que puede confundir
                const type = Math.random() > 0.5 ? TILE_TYPES.CURVE : TILE_TYPES.STRAIGHT;
                grid[next.row * COLS + next.col] = new Tile(next.col, next.row, type);
            }
            curr = next;
        }
    }
}

function createPathTile(col, row, prev, next) {
    let fromDir = 0, toDir = 0;
    
    if (prev.col < col) fromDir = DIR.W;
    else if (prev.col > col) fromDir = DIR.E;
    else if (prev.row < row) fromDir = DIR.N;
    else fromDir = DIR.S;
    
    if (next.col > col) toDir = DIR.E;
    else if (next.col < col) toDir = DIR.W;
    else if (next.row > row) toDir = DIR.S;
    else toDir = DIR.N;
    
    const needed = fromDir | toDir;
    let type, tile;
    
    if (needed === (DIR.N | DIR.S) || needed === (DIR.E | DIR.W)) {
        type = TILE_TYPES.STRAIGHT;
    } else {
        type = TILE_TYPES.CURVE;
    }
    
    tile = new Tile(col, row, type);
    
    // Encontrar rotación correcta
    for (let r = 0; r < 4; r++) {
        tile.rotation = r;
        if ((tile.getConnections() & needed) === needed) {
            tile.correctRotation = r;
            break;
        }
    }
    
    return tile;
}

function fillEmpty() {
    for (let i = 0; i < COLS * ROWS; i++) {
        if (!grid[i]) {
            const col = i % COLS, row = Math.floor(i / COLS);
            const rand = Math.random();
            let type;
            if (rand < 0.4) type = TILE_TYPES.STRAIGHT;
            else if (rand < 0.75) type = TILE_TYPES.CURVE;
            else if (rand < 0.9) type = TILE_TYPES.T_JUNCTION;
            else type = TILE_TYPES.CROSS;
            grid[i] = new Tile(col, row, type);
        }
    }
}

function randomizeRotations() {
    grid.forEach(tile => {
        if (tile && !tile.locked && tile.type !== TILE_TYPES.BLOCKED) {
            tile.rotation = Math.floor(Math.random() * 4);
        }
    });
}

function addSpecials(features) {
    if (!features.length) return;
    const eligible = correctPath.slice(1, -1).filter(p => {
        const t = grid[p.row * COLS + p.col];
        return t && !t.special && !t.locked;
    });
    
    features.forEach(f => {
        for (let i = 0; i < 2 && eligible.length > 0; i++) {
            const idx = Math.floor(Math.random() * eligible.length);
            const pos = eligible.splice(idx, 1)[0];
            const tile = grid[pos.row * COLS + pos.col];
            if (f === 'semaphore') { tile.special = 'semaphore'; tile.semaphoreState = 'red'; specialTiles.push(tile); }
            else if (f === 'puddle') { tile.special = 'puddle'; }
            else if (f === 'boost') { tile.special = 'boost'; }
        }
    });
}

function checkConnections() {
    grid.forEach(t => { if (t) t.powered = false; });
    const start = grid[0];
    if (!start) return;
    
    const queue = [start];
    start.powered = true;
    
    while (queue.length > 0) {
        const curr = queue.shift();
        const conn = curr.getConnections();
        
        [DIR.N, DIR.E, DIR.S, DIR.W].forEach(dir => {
            if (conn & dir) {
                const d = DIR_DELTA[dir];
                const nc = curr.col + d.dc, nr = curr.row + d.dr;
                if (nc >= 0 && nc < COLS && nr >= 0 && nr < ROWS) {
                    const neighbor = grid[nr * COLS + nc];
                    if (neighbor && !neighbor.powered && neighbor.type !== TILE_TYPES.BLOCKED) {
                        if (neighbor.getConnections() & OPPOSITE[dir]) {
                            neighbor.powered = true;
                            queue.push(neighbor);
                        }
                    }
                }
            }
        });
    }
}

function startCountdown() {
    clearInterval(countdownTimer);
    countdownTimer = setInterval(() => {
        if (gameState !== 'EDITING') { clearInterval(countdownTimer); return; }
        timeLeft--;
        $('timerDisplay').textContent = `⏱️ ${timeLeft}`;
        $('progressBar').style.width = `${(timeLeft / maxTime) * 100}%`;
        
        if (timeLeft <= 5) {
            $('progressBar').className = 'progress-bar h-full bg-red-500 rounded-full';
            $('timerDisplay').classList.add('timer-warning');
            playSound('warning');
        } else if (timeLeft <= 10) {
            $('progressBar').className = 'progress-bar h-full bg-yellow-500 rounded-full';
        }
        
        if (timeLeft <= 0) {
            clearInterval(countdownTimer);
            $('statusText').textContent = '¡TIEMPO!';
            $('statusText').className = 'text-red-400 font-bold text-xs pulse';
            setTimeout(startCar, 500);
        }
    }, 1000);
}

function resetCar() {
    const start = grid[0];
    const conn = start.getConnections();
    let dir = DIR.E;
    [DIR.E, DIR.S, DIR.N].forEach(d => { if (conn & d) dir = d; });
    
    const config = LEVEL_CONFIG[Math.min(level - 1, 39)];
    car = {
        col: 0, row: 0,
        x: TILE_SIZE / 2, y: TILE_SIZE / 2,
        dir, angle: dir === DIR.E ? 0 : dir === DIR.S ? Math.PI/2 : -Math.PI/2,
        speed: config.speed, baseSpeed: config.speed, waiting: false
    };
    const d = DIR_DELTA[dir];
    car.x -= d.dc * 12; car.y -= d.dr * 12;
    gameState = 'EDITING';
    draw();
}

function startCar() {
    initAudio();
    if (gameState !== 'EDITING') return;
    clearInterval(countdownTimer);
    
    gameState = 'RUNNING';
    $('btnStart').classList.add('opacity-50', 'pointer-events-none');
    $('statusText').textContent = '¡EN MARCHA!';
    $('statusText').className = 'text-emerald-400 font-bold text-xs';
    
    // Iniciar semáforos
    specialTiles.forEach(tile => {
        if (tile.special === 'semaphore') {
            const cycle = () => {
                if (gameState !== 'RUNNING') return;
                setTimeout(() => {
                    tile.semaphoreState = 'yellow'; draw();
                    setTimeout(() => {
                        tile.semaphoreState = 'green'; draw();
                        setTimeout(() => {
                            tile.semaphoreState = 'red'; draw();
                            cycle();
                        }, 2500);
                    }, 800);
                }, 1500 + Math.random() * 1500);
            };
            cycle();
        }
    });
    
    engineSoundInterval = setInterval(() => {
        if (gameState === 'RUNNING' && !car.waiting) playSound('engine');
    }, 250);
    
    gameLoop();
}

function gameLoop() {
    if (gameState !== 'RUNNING') return;
    
    if (car.waiting) {
        const tile = grid[car.row * COLS + car.col];
        if (tile?.special === 'semaphore' && tile.semaphoreState === 'green') car.waiting = false;
        else { draw(); animationId = requestAnimationFrame(gameLoop); return; }
    }
    
    const cx = car.col * TILE_SIZE + TILE_SIZE / 2;
    const cy = car.row * TILE_SIZE + TILE_SIZE / 2;
    const dist = Math.sqrt((cx - car.x) ** 2 + (cy - car.y) ** 2);
    
    if (dist < 4) {
        car.x = cx; car.y = cy;
        const tile = grid[car.row * COLS + car.col];
        
        if (tile?.special === 'semaphore' && tile.semaphoreState !== 'green') {
            car.waiting = true; draw();
            animationId = requestAnimationFrame(gameLoop); return;
        }
        
        if (tile?.special === 'puddle') car.speed = car.baseSpeed * 0.5;
        else if (tile?.special === 'boost') car.speed = car.baseSpeed * 1.8;
        else car.speed = car.baseSpeed;
        
        // Verificar si llegó a una meta
        if (tile?.type === TILE_TYPES.END_REAL) { win(); return; }
        if (tile?.type === TILE_TYPES.END_FAKE) { crash('¡Meta falsa! 😵'); return; }
        
        const conn = tile?.getConnections() || 0;
        const entry = OPPOSITE[car.dir];
        
        if (!tile?.locked && !(conn & entry)) { crash('¡Camino bloqueado!'); return; }
        
        const exits = conn & ~entry;
        let exitDir = 0;
        if (exits & car.dir) exitDir = car.dir;
        else [DIR.N, DIR.E, DIR.S, DIR.W].forEach(d => { if (!exitDir && (exits & d)) exitDir = d; });
        
        if (!exitDir) { crash('¡Sin salida!'); return; }
        
        const d = DIR_DELTA[exitDir];
        const nc = car.col + d.dc, nr = car.row + d.dr;
        
        if (nc < 0 || nc >= COLS || nr < 0 || nr >= ROWS) { animateCrash(exitDir, '¡Fuera!'); return; }
        
        const next = grid[nr * COLS + nc];
        if (!next || next.type === TILE_TYPES.BLOCKED) { animateCrash(exitDir, '¡Bloqueado!'); return; }
        if (!(next.getConnections() & OPPOSITE[exitDir])) { animateCrash(exitDir, '¡Choque!'); return; }
        
        car.dir = exitDir; car.col = nc; car.row = nr;
        car.angle = exitDir === DIR.N ? -Math.PI/2 : exitDir === DIR.E ? 0 : exitDir === DIR.S ? Math.PI/2 : Math.PI;
    }
    
    const d = DIR_DELTA[car.dir];
    car.x += d.dc * car.speed; car.y += d.dr * car.speed;
    
    draw();
    animationId = requestAnimationFrame(gameLoop);
}

function animateCrash(dir, msg) {
    let frames = 10;
    const d = DIR_DELTA[dir];
    const anim = () => {
        if (frames-- > 0) { car.x += d.dc * 2; car.y += d.dr * 2; draw(); requestAnimationFrame(anim); }
        else crash(msg);
    };
    anim();
}

function crash(msg) {
    gameState = 'CRASHED';
    clearInterval(countdownTimer); clearInterval(engineSoundInterval);
    playSound('crash');
    $('gameContainer').classList.add('shake');
    setTimeout(() => $('gameContainer').classList.remove('shake'), 500);
    showOverlay('💥', '¡CHOQUE!', msg, '', resetLevel, 'Reintentar');
}

function win() {
    gameState = 'WON';
    clearInterval(countdownTimer); clearInterval(engineSoundInterval);
    playSound('win');
    const bonus = timeLeft * 10 + level * 25;
    
    if (level >= 40) {
        showOverlay('🎉', '¡COMPLETADO!', `${driverName}, ¡ganaste!`, `${bonus} pts`, () => { level = 1; $('levelDisplay').textContent = level; generateLevel(); }, 'Reiniciar');
    } else {
        showOverlay('🏆', '¡NIVEL ' + level + '!', `Tiempo: ${timeLeft}s`, `+${bonus} pts`, () => { level++; $('levelDisplay').textContent = level; generateLevel(); }, 'Siguiente');
    }
}

function showOverlay(icon, title, sub, bonus, action, btn) {
    $('overlayIcon').textContent = icon;
    $('overlayTitle').textContent = title;
    $('overlaySubtitle').textContent = sub;
    $('overlayBonus').textContent = bonus;
    $('overlayBtn').textContent = btn;
    $('overlayBtn').onclick = action;
    $('overlay').classList.remove('hidden');
}

// Dibujo
function draw() {
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    grid.forEach(t => { if (t) drawTile(t); });
    if (car) drawCar();
}

function drawTile(tile) {
    const x = tile.col * TILE_SIZE, y = tile.row * TILE_SIZE;
    const cx = x + TILE_SIZE / 2, cy = y + TILE_SIZE / 2;
    const rw = TILE_SIZE * 0.48, h = rw / 2;
    
    ctx.save();
    ctx.fillStyle = '#334155';
    ctx.fillRect(x + 1, y + 1, TILE_SIZE - 2, TILE_SIZE - 2);
    
    if (tile.type === TILE_TYPES.BLOCKED) {
        ctx.fillStyle = tile.special === 'tree' ? '#166534' : tile.special === 'broken' ? '#4b5563' : '#f97316';
        ctx.fillRect(x + 5, y + 5, TILE_SIZE - 10, TILE_SIZE - 10);
        ctx.font = `${TILE_SIZE * 0.4}px sans-serif`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(tile.special === 'tree' ? '🌳' : tile.special === 'broken' ? '⚠️' : '🚧', cx, cy);
        ctx.restore(); return;
    }
    
    ctx.translate(cx, cy);
    ctx.rotate(tile.rotation * Math.PI / 2);
    
    let color = tile.powered ? '#4ade80' : '#64748b';
    if (tile.type === TILE_TYPES.START) color = '#10b981';
    else if (tile.type === TILE_TYPES.END_REAL) color = tile.powered ? '#22c55e' : '#ef4444';
    else if (tile.type === TILE_TYPES.END_FAKE) color = tile.powered ? '#f97316' : '#78716c';
    
    ctx.fillStyle = color;
    
    const conn = tile.type.base;
    const s = TILE_SIZE;
    
    // Dibujar brazos de carretera
    if (conn & DIR.N) ctx.fillRect(-h, -s/2, rw, s/2 + h);
    if (conn & DIR.S) ctx.fillRect(-h, -h, rw, s/2 + h);
    if (conn & DIR.E) ctx.fillRect(-h, -h, s/2 + h, rw);
    if (conn & DIR.W) ctx.fillRect(-s/2, -h, s/2 + h, rw);
    
    // Centro
    ctx.beginPath(); ctx.arc(0, 0, h, 0, Math.PI * 2); ctx.fill();
    
    // Líneas amarillas
    ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 2; ctx.setLineDash([4, 3]);
    if ((conn & DIR.N) && (conn & DIR.S)) {
        ctx.beginPath(); ctx.moveTo(0, -s/2); ctx.lineTo(0, s/2); ctx.stroke();
    }
    if ((conn & DIR.E) && (conn & DIR.W)) {
        ctx.beginPath(); ctx.moveTo(-s/2, 0); ctx.lineTo(s/2, 0); ctx.stroke();
    }
    ctx.setLineDash([]);
    
    // Texto especial
    ctx.fillStyle = 'white'; ctx.font = 'bold 10px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    if (tile.type === TILE_TYPES.START) ctx.fillText('GO', 0, 0);
    
    ctx.restore();
    
    // Meta
    if (tile.type === TILE_TYPES.END_REAL || tile.type === TILE_TYPES.END_FAKE) {
        ctx.font = `${TILE_SIZE * 0.35}px sans-serif`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('🏁', cx, cy);
        if (tile.type === TILE_TYPES.END_FAKE) {
            ctx.fillStyle = 'rgba(239, 68, 68, 0.3)';
            ctx.fillRect(x + 2, y + 2, TILE_SIZE - 4, TILE_SIZE - 4);
        }
    }
    
    // Elementos especiales
    if (tile.special === 'semaphore') {
        ctx.fillStyle = '#1f2937';
        ctx.fillRect(cx - 5, cy - 12, 10, 24);
        const cols = { red: tile.semaphoreState === 'red' ? '#ef4444' : '#3f1515', yellow: tile.semaphoreState === 'yellow' ? '#fbbf24' : '#3f3515', green: tile.semaphoreState === 'green' ? '#22c55e' : '#153f25' };
        ctx.beginPath(); ctx.arc(cx, cy - 7, 3, 0, Math.PI * 2); ctx.fillStyle = cols.red; ctx.fill();
        ctx.beginPath(); ctx.arc(cx, cy, 3, 0, Math.PI * 2); ctx.fillStyle = cols.yellow; ctx.fill();
        ctx.beginPath(); ctx.arc(cx, cy + 7, 3, 0, Math.PI * 2); ctx.fillStyle = cols.green; ctx.fill();
    } else if (tile.special === 'puddle') {
        ctx.fillStyle = 'rgba(59, 130, 246, 0.5)';
        ctx.beginPath(); ctx.ellipse(cx, cy, TILE_SIZE * 0.15, TILE_SIZE * 0.1, 0, 0, Math.PI * 2); ctx.fill();
    } else if (tile.special === 'boost') {
        ctx.font = `${TILE_SIZE * 0.25}px sans-serif`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('⚡', cx, cy);
    }
}

function drawCar() {
    ctx.save();
    ctx.translate(car.x, car.y);
    ctx.rotate(car.angle);
    ctx.shadowColor = 'rgba(0,0,0,0.4)'; ctx.shadowBlur = 5;
    
    ctx.fillStyle = car.waiting ? '#94a3b8' : '#f472b6';
    ctx.beginPath(); ctx.roundRect(-10, -7, 20, 14, 3); ctx.fill();
    ctx.fillStyle = car.waiting ? '#64748b' : '#ec4899';
    ctx.beginPath(); ctx.roundRect(-6, -5, 8, 10, 2); ctx.fill();
    ctx.fillStyle = '#1e293b'; ctx.fillRect(-3, -3, 5, 6);
    ctx.fillStyle = car.waiting ? '#94a3b8' : '#fef08a';
    ctx.fillRect(8, -4, 2, 3); ctx.fillRect(8, 1, 2, 3);
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(-7, -9, 4, 2); ctx.fillRect(-7, 7, 4, 2);
    ctx.fillRect(3, -9, 4, 2); ctx.fillRect(3, 7, 4, 2);
    
    ctx.restore();
}

// --- INICIO ---
window.onload = init;
</script>
