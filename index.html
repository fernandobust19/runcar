<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Delivery Rush - Entregas Rápidas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            touch-action: manipulation;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
            overflow: hidden;
            user-select: none;
        }
        canvas {
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            border-radius: 10px;
            background-color: #1e293b;
            border: 2px solid #334155;
            cursor: pointer;
        }
        .btn-game { transition: all 0.1s; -webkit-tap-highlight-color: transparent; }
        .btn-game:active { transform: scale(0.95); }
        .shake { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-5px, 0, 0); }
            40%, 60% { transform: translate3d(5px, 0, 0); }
        }
        .pulse { animation: pulse 0.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .timer-warning { animation: timerPulse 0.5s infinite; color: #ef4444 !important; }
        @keyframes timerPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        .progress-bar { transition: width 1s linear; }
        input[type="text"] {
            background: #1e293b; border: 2px solid #475569; color: white;
            padding: 12px 16px; border-radius: 10px; font-size: 18px;
            width: 100%; max-width: 280px; text-align: center;
        }
        input[type="text"]:focus { outline: none; border-color: #10b981; }
        ::-webkit-scrollbar { display: none; }
        .vehicle-btn { transition: all 0.2s; border: 2px solid transparent; }
        .vehicle-btn.selected { border-color: #10b981; transform: scale(1.05); }
        .color-btn { width: 32px; height: 32px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; }
        .color-btn.selected { border-color: white; transform: scale(1.15); }
        
        /* Selector de empresa - Compacto */
        .company-btn { 
            width: 36px; 
            height: 36px; 
            border-radius: 8px; 
            border: 2px solid transparent; 
            cursor: pointer; 
            background: #1e293b;
            padding: 2px;
            transition: all 0.2s;
        }
        .company-btn:hover { transform: scale(1.05); }
        .company-btn.selected { border-color: #10b981; transform: scale(1.08); box-shadow: 0 0 10px rgba(16, 185, 129, 0.5); }
        .company-btn img { width: 100%; height: 100%; object-fit: contain; border-radius: 5px; }
        
        /* Slider de color */
        .color-slider-container {
            display: flex;
            align-items: center;
            gap: 8px;
            justify-content: center;
        }
        .color-slider {
            -webkit-appearance: none;
            width: 180px;
            height: 20px;
            border-radius: 10px;
            background: linear-gradient(to right, #1a1a1a, #f472b6, #ef4444, #f97316, #eab308, #22c55e, #3b82f6, #8b5cf6, #ffffff);
            outline: none;
            cursor: pointer;
        }
        .color-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: white;
            border: 3px solid #10b981;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
        .color-slider::-moz-range-thumb {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: white;
            border: 3px solid #10b981;
            cursor: pointer;
        }
        .color-preview {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 2px solid white;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
        
        /* Input compacto */
        input[type="text"].compact {
            padding: 8px 12px;
            font-size: 14px;
            max-width: 200px;
        }
        
        /* Preparación del pedido - Fuera del área de juego */
        .prep-container {
            display: flex;
            align-items: center;
            gap: 12px;
            background: linear-gradient(135deg, #1e293b, #334155);
            padding: 10px 16px;
            border-radius: 12px;
            border: 2px solid #475569;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .prep-icon {
            font-size: 36px;
            animation: prepShake 0.5s ease-in-out infinite;
        }
        @keyframes prepShake {
            0%, 100% { transform: rotate(-5deg); }
            50% { transform: rotate(5deg); }
        }
        .prep-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .prep-text {
            font-size: 12px;
            color: #fbbf24;
            font-weight: bold;
        }
        .prep-bar-container {
            width: 100px;
            height: 8px;
            background: #1e293b;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid #475569;
        }
        .prep-bar {
            height: 100%;
            background: linear-gradient(90deg, #f97316, #eab308);
            border-radius: 4px;
            transition: width 0.3s ease;
            width: 0%;
        }
        .prep-bar.filling {
            animation: barGlow 1s ease-in-out infinite;
        }
        @keyframes barGlow {
            0%, 100% { box-shadow: 0 0 5px #f97316; }
            50% { box-shadow: 0 0 15px #eab308; }
        }
        
        /* Mensaje de salida del pedido */
        .order-ready {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: linear-gradient(135deg, #10b981, #059669);
            padding: 30px 50px;
            border-radius: 20px;
            z-index: 35;
            text-align: center;
            box-shadow: 0 10px 40px rgba(16, 185, 129, 0.5);
            animation: orderPopup 0.5s ease-out forwards;
        }
        @keyframes orderPopup {
            0% { transform: translate(-50%, -50%) scale(0) rotate(-10deg); }
            50% { transform: translate(-50%, -50%) scale(1.1) rotate(5deg); }
            100% { transform: translate(-50%, -50%) scale(1) rotate(0deg); }
        }
        .order-ready h2 {
            font-size: 28px;
            color: white;
            margin: 0;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        .order-ready .emoji {
            font-size: 50px;
            display: block;
            margin-bottom: 10px;
            animation: riderGo 0.3s ease-in-out infinite alternate;
        }
        @keyframes riderGo {
            from { transform: translateX(-5px); }
            to { transform: translateX(5px); }
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col items-center justify-center overflow-hidden">

    <!-- PANTALLA DE INICIO - COMPACTA -->
    <div id="startScreen" class="absolute inset-0 bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 flex flex-col items-center justify-center z-50 p-2">
        <div class="text-center">
            <div class="text-3xl mb-1">🛵📦</div>
            <h1 class="text-2xl font-bold text-emerald-400 mb-0">Delivery Rush</h1>
            <p class="text-slate-400 mb-2 text-xs">¡Entregas Rápidas!</p>
            
            <!-- Nombre -->
            <div class="mb-2">
                <input type="text" id="driverName" placeholder="Tu nombre" maxlength="12" autocomplete="off" class="compact">
            </div>
            
            <!-- Selector de Empresa -->
            <div class="mb-2">
                <label class="block text-slate-400 mb-1 text-xs">Empresa:</label>
                <div class="flex justify-center gap-1 flex-wrap max-w-xs mx-auto">
                    <button onclick="selectCompany('rappi')" id="btn-rappi" class="company-btn selected">
                        <img src="LOGO-RAPPI.png" alt="Rappi">
                    </button>
                    <button onclick="selectCompany('uber')" id="btn-uber" class="company-btn">
                        <img src="UBER.png" alt="Uber">
                    </button>
                    <button onclick="selectCompany('pedidosya')" id="btn-pedidosya" class="company-btn">
                        <img src="pedidosya.png" alt="PedidosYa">
                    </button>
                    <button onclick="selectCompany('indriver')" id="btn-indriver" class="company-btn">
                        <img src="INDRIVER.png" alt="InDriver">
                    </button>
                    <button onclick="selectCompany('amazon')" id="btn-amazon" class="company-btn">
                        <img src="amazon.png" alt="Amazon">
                    </button>
                    <button onclick="selectCompany('servientrega')" id="btn-servientrega" class="company-btn">
                        <img src="SERVIENTREGA.png" alt="Servientrega">
                    </button>
                </div>
            </div>
            
            <!-- Selector de Vehículo -->
            <div class="mb-2">
                <label class="block text-slate-400 mb-1 text-xs">Vehículo:</label>
                <div class="flex justify-center gap-2">
                    <button onclick="selectVehicle('moto')" id="btn-moto" class="vehicle-btn selected bg-slate-700 p-2 rounded-lg">
                        <span class="text-xl">🏍️</span>
                        <p class="text-[10px]">Moto</p>
                    </button>
                    <button onclick="selectVehicle('car')" id="btn-car" class="vehicle-btn bg-slate-700 p-2 rounded-lg">
                        <span class="text-xl">🚗</span>
                        <p class="text-[10px]">Auto</p>
                    </button>
                    <button onclick="selectVehicle('truck')" id="btn-truck" class="vehicle-btn bg-slate-700 p-2 rounded-lg">
                        <span class="text-xl">🛻</span>
                        <p class="text-[10px]">Camioneta</p>
                    </button>
                    <button onclick="selectVehicle('bus')" id="btn-bus" class="vehicle-btn bg-slate-700 p-2 rounded-lg">
                        <span class="text-xl">🚌</span>
                        <p class="text-[10px]">Bus</p>
                    </button>
                </div>
            </div>
            
            <!-- Selector de Color con Slider -->
            <div class="mb-3">
                <label class="block text-slate-400 mb-1 text-xs">Color:</label>
                <div class="color-slider-container">
                    <input type="range" min="0" max="100" value="0" class="color-slider" id="colorSlider" oninput="updateColorFromSlider(this.value)">
                    <div class="color-preview" id="colorPreview" style="background: #1a1a1a;"></div>
                </div>
            </div>
            
            <button onclick="startGame()" class="btn-game bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 px-6 rounded-lg text-sm shadow-lg border-b-2 border-emerald-800">
                🛵 ¡A REPARTIR!
            </button>
            
            <p class="mt-2 text-slate-500 text-[10px]">👆 Toca fichas para girar | 📦 Entrega a tiempo</p>
        </div>
    </div>

    <!-- Header -->
    <div class="absolute top-0 w-full p-2 flex justify-between items-center pointer-events-none z-10">
        <div class="bg-slate-800/95 px-3 py-1.5 rounded-lg border border-slate-600 shadow-lg flex items-center gap-2">
            <img id="companyLogo" src="LOGO-RAPPI.png" alt="Empresa" class="w-10 h-10 rounded-lg object-contain bg-white p-1">
            <div>
                <p class="text-emerald-400 font-bold text-sm"><span id="vehicleIcon">🏍️</span> <span id="driverDisplay">Repartidor</span></p>
                <p class="text-xs text-slate-400">Pedido <span id="levelDisplay">1</span>/40</p>
                <p class="text-yellow-400 font-bold text-sm">💰 $<span id="moneyDisplay">0</span></p>
            </div>
        </div>
        
        <!-- Preparación del pedido - En el header -->
        <div id="prepContainer" class="prep-container hidden">
            <div class="prep-icon">📦</div>
            <div class="prep-info">
                <span class="prep-text" id="prepText">Preparando...</span>
                <div class="prep-bar-container">
                    <div class="prep-bar filling" id="prepBar"></div>
                </div>
            </div>
        </div>
        
        <div id="statusContainer" class="bg-slate-800/95 px-3 py-1.5 rounded-lg border border-slate-600 shadow-lg flex flex-col items-center">
            <span id="statusText" class="text-yellow-400 font-bold text-xs">PREPARA LA RUTA</span>
            <div class="w-24 h-1.5 bg-slate-700 rounded-full mt-1 overflow-hidden">
                <div id="progressBar" class="progress-bar h-full bg-emerald-500 rounded-full" style="width: 100%"></div>
            </div>
        </div>
        <div class="bg-slate-800/95 px-3 py-1.5 rounded-lg border border-slate-600 shadow-lg">
            <span id="timerDisplay" class="text-blue-400 font-bold text-lg">⏱️ 30</span>
        </div>
    </div>

    <!-- Game Area -->
    <div class="relative p-1" id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        
        <!-- Mensaje de salida del pedido -->
        <div id="orderReady" class="order-ready hidden">
            <span class="emoji" id="orderVehicleEmoji">🛵</span>
            <span class="emoji" style="font-size: 30px;">💨</span>
            <h2>¡SALE EL PEDIDO!</h2>
        </div>
        
        <div id="overlay" class="hidden absolute inset-0 bg-black/90 flex flex-col items-center justify-center z-20 rounded-xl p-4">
            <div class="text-6xl mb-3 animate-bounce" id="overlayIcon">🏆</div>
            <h2 class="text-2xl font-bold mb-1 text-white text-center" id="overlayTitle"></h2>
            <p class="text-slate-300 text-sm mb-1 text-center" id="overlaySubtitle"></p>
            <p class="text-yellow-400 text-xs mb-4" id="overlayBonus"></p>
            <button id="overlayBtn" class="bg-emerald-500 hover:bg-emerald-400 text-white font-bold py-3 px-8 rounded-full shadow-lg btn-game">Siguiente</button>
        </div>
    </div>

    <!-- Hint -->
    <div class="text-center text-slate-400 text-xs mt-1 px-4">
        <p id="levelHint">Prepara la ruta de entrega 📦</p>
    </div>

    <!-- Controls -->
    <div class="absolute bottom-3 w-full flex justify-center gap-2 px-3 z-10">
        <button onclick="resetLevel()" class="btn-game bg-slate-600 hover:bg-slate-500 text-white p-3 rounded-xl shadow-lg border-b-4 border-slate-800">🔄</button>
        <button onclick="startCar()" id="btnStart" class="btn-game bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-8 rounded-xl text-base shadow-lg border-b-4 border-emerald-800">� ¡ENTREGAR!</button>
        <button onclick="toggleSound()" class="btn-game bg-blue-600 hover:bg-blue-500 text-white p-3 rounded-xl shadow-lg border-b-4 border-blue-800"><span id="soundIcon">🔊</span></button>
        <button onclick="showMenu()" class="btn-game bg-purple-600 hover:bg-purple-500 text-white p-3 rounded-xl shadow-lg border-b-4 border-purple-800">☰</button>
    </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Variables de personalización del vehículo
let selectedVehicle = 'moto';
let selectedColor = '#1a1a1a';
let selectedCompany = 'rappi';

// Colores de las empresas
const companyColors = {
    rappi: '#ff5a00',
    uber: '#000000',
    pedidosya: '#d42e58',
    indriver: '#2db742',
    amazon: '#ff9900',
    servientrega: '#003087'
};

// Logos de las empresas
const companyLogos = {
    rappi: 'LOGO-RAPPI.png',
    uber: 'UBER.png',
    pedidosya: 'pedidosya.png',
    indriver: 'INDRIVER.png',
    amazon: 'amazon.png',
    servientrega: 'SERVIENTREGA.png'
};

// Emojis de vehículos
const vehicleEmojis = {
    moto: '🏍️',
    car: '🚗',
    truck: '🛻',
    bus: '🚌'
};

function selectCompany(company) {
    selectedCompany = company;
    document.querySelectorAll('.company-btn').forEach(btn => btn.classList.remove('selected'));
    document.getElementById('btn-' + company).classList.add('selected');
}

// Variables para animación de preparación
let prepAnimationInterval = null;

// Colores disponibles para el slider
const sliderColors = [
    '#1a1a1a', '#4a4a4a', '#6b7280', 
    '#f472b6', '#ec4899', '#db2777',
    '#ef4444', '#dc2626', '#b91c1c',
    '#f97316', '#ea580c', '#c2410c',
    '#eab308', '#ca8a04', '#a16207',
    '#22c55e', '#16a34a', '#15803d',
    '#3b82f6', '#2563eb', '#1d4ed8',
    '#8b5cf6', '#7c3aed', '#6d28d9',
    '#ffffff', '#e5e5e5', '#d4d4d4'
];

function updateColorFromSlider(value) {
    const index = Math.floor((value / 100) * (sliderColors.length - 1));
    selectedColor = sliderColors[index];
    document.getElementById('colorPreview').style.background = selectedColor;
}

function selectVehicle(type) {
    selectedVehicle = type;
    document.querySelectorAll('.vehicle-btn').forEach(btn => btn.classList.remove('selected'));
    document.getElementById('btn-' + type).classList.add('selected');
}

function selectColor(color) {
    selectedColor = color;
    document.getElementById('colorPreview').style.background = color;
}

let audioCtx = null, soundEnabled = true;
function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
function playSound(type) {
    if (!soundEnabled || !audioCtx) return;
    try {
        const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        const t = audioCtx.currentTime;
        if (type === 'rotate') { osc.frequency.setValueAtTime(600, t); osc.frequency.exponentialRampToValueAtTime(300, t + 0.08); gain.gain.setValueAtTime(0.08, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.08); osc.start(t); osc.stop(t + 0.08); }
        else if (type === 'engine') { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(80, t); gain.gain.setValueAtTime(0.04, t); osc.start(t); osc.stop(t + 0.12); }
        else if (type === 'crash') { osc.type = 'square'; osc.frequency.setValueAtTime(150, t); osc.frequency.exponentialRampToValueAtTime(40, t + 0.3); gain.gain.setValueAtTime(0.2, t); osc.start(t); osc.stop(t + 0.3); }
        else if (type === 'win') { [523,659,784,1047].forEach((f,i) => { const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.connect(g); g.connect(audioCtx.destination); o.frequency.setValueAtTime(f, t+i*0.15); g.gain.setValueAtTime(0.1, t+i*0.15); o.start(t+i*0.15); o.stop(t+i*0.15+0.2); }); }
        else if (type === 'warning') { osc.frequency.setValueAtTime(400, t); gain.gain.setValueAtTime(0.1, t); osc.start(t); osc.stop(t + 0.1); }
    } catch(e) {}
}
function toggleSound() { soundEnabled = !soundEnabled; document.getElementById('soundIcon').textContent = soundEnabled ? '🔊' : '🔇'; }

// Configuración de niveles - MAPAS MÁS GRANDES
const LEVEL_CONFIG = [];
for (let i = 1; i <= 40; i++) {
    LEVEL_CONFIG.push({
        cols: Math.min(5 + Math.floor(i / 4), 9),
        rows: Math.min(6 + Math.floor(i / 3), 11),
        time: 45 + i * 3,
        speed: 2.0 + i * 0.08,
        obstacles: Math.min(Math.floor(i / 5), 5),
        deadEnds: Math.min(2 + Math.floor(i / 4), 8),
        features: i >= 10 ? (i >= 18 ? (i >= 26 ? ['semaphore','puddle','boost'] : ['semaphore','puddle']) : ['semaphore']) : []
    });
}

let TILE_SIZE = 55, COLS = 6, ROWS = 7;
const DIR = { N: 1, E: 2, S: 4, W: 8 };
const DIR_DELTA = { 1: {dc:0,dr:-1}, 2: {dc:1,dr:0}, 4: {dc:0,dr:1}, 8: {dc:-1,dr:0} };
const OPPOSITE = { 1: 4, 2: 8, 4: 1, 8: 2 };

// Tipos de tiles - TODAS las metas son válidas
const TILE_TYPES = {
    STRAIGHT: { id: 1, base: DIR.N | DIR.S },
    CURVE: { id: 2, base: DIR.N | DIR.E },
    T_JUNCTION: { id: 3, base: DIR.N | DIR.E | DIR.S },
    CROSS: { id: 4, base: DIR.N | DIR.E | DIR.S | DIR.W },
    START: { id: 5, base: DIR.N | DIR.E | DIR.S | DIR.W, locked: true },
    END: { id: 6, base: DIR.N | DIR.E | DIR.S | DIR.W, locked: true }, // Una sola meta con múltiples entradas
    BLOCKED: { id: 7, base: 0, locked: true },
    // Calles trampa - transitables pero SIN flechas (confunden)
    DEAD_STRAIGHT: { id: 8, base: DIR.N | DIR.S, noArrows: true },
    DEAD_CURVE: { id: 9, base: DIR.N | DIR.E, noArrows: true }
};

let grid = [], specialTiles = [], car = null, level = 1, driverName = "Repartidor";
let gameState = 'START', animationId, countdownTimer, timeLeft, maxTime, engineSoundInterval;
let totalMoney = 0; // Dinero acumulado por propinas
let savedEndPosition = null; // Posición guardada de la casa para reintentos
let currentLevelForEnd = 0; // Nivel actual para saber cuándo cambiar la casa

const $ = id => document.getElementById(id);

class Tile {
    constructor(col, row, type, rotation = 0) {
        this.col = col; this.row = row; this.type = type;
        this.rotation = rotation; this.locked = type.locked || false;
        this.powered = false; this.special = null; this.semaphoreState = 'red';
        this.isEnd = false; this.isDeadEnd = false;
    }
    getConnections() {
        if (this.type === TILE_TYPES.BLOCKED) return 0;
        let conn = this.type.base;
        for (let i = 0; i < this.rotation; i++) {
            let n = 0;
            if (conn & DIR.N) n |= DIR.E;
            if (conn & DIR.E) n |= DIR.S;
            if (conn & DIR.S) n |= DIR.W;
            if (conn & DIR.W) n |= DIR.N;
            conn = n;
        }
        return conn;
    }
}

function startGame() {
    initAudio();
    driverName = $('driverName').value.trim() || "Repartidor";
    $('driverDisplay').textContent = driverName;
    $('vehicleIcon').textContent = vehicleEmojis[selectedVehicle] || '🏍️';
    $('companyLogo').src = companyLogos[selectedCompany] || 'LOGO-RAPPI.png';
    $('startScreen').classList.add('hidden');
    level = 1; $('levelDisplay').textContent = level;
    generateLevel();
}

function showMenu() {
    if (confirm('¿Volver al menú?')) {
        cancelAnimationFrame(animationId);
        clearInterval(countdownTimer);
        clearInterval(engineSoundInterval);
        $('startScreen').classList.remove('hidden');
        gameState = 'START';
    }
}

function init() {
    resize();
    window.addEventListener('resize', () => { if (gameState !== 'START') { resize(); draw(); } });
    canvas.addEventListener('pointerdown', handleClick);
}

function resize() {
    const config = LEVEL_CONFIG[Math.min(level - 1, 39)];
    COLS = config.cols; ROWS = config.rows;
    const maxW = innerWidth - 16, maxH = innerHeight - 160;
    TILE_SIZE = Math.min(Math.floor(maxW / COLS), Math.floor(maxH / ROWS), 60);
    canvas.width = COLS * TILE_SIZE; canvas.height = ROWS * TILE_SIZE;
}

function handleClick(e) {
    initAudio();
    if (gameState !== 'EDITING') return;
    const rect = canvas.getBoundingClientRect();
    const clickX = e.clientX - rect.left, clickY = e.clientY - rect.top;
    
    if (car) {
        const carDist = Math.sqrt((clickX - car.x) ** 2 + (clickY - car.y) ** 2);
        if (carDist < TILE_SIZE * 0.5) { rotateCar(); return; }
    }
    
    const col = Math.floor(clickX / TILE_SIZE), row = Math.floor(clickY / TILE_SIZE);
    if (col >= 0 && col < COLS && row >= 0 && row < ROWS) {
        const tile = grid[row * COLS + col];
        if (tile && !tile.locked && tile.type !== TILE_TYPES.BLOCKED) {
            tile.rotation = (tile.rotation + 1) % 4;
            playSound('rotate');
            checkConnections();
            draw();
        }
    }
}

function rotateCar() {
    if (!car || gameState !== 'EDITING') return;
    const start = grid[car.row * COLS + car.col];
    if (!start) return;
    const conn = start.getConnections();
    const dirs = [DIR.N, DIR.E, DIR.S, DIR.W].filter(d => conn & d);
    if (dirs.length <= 1) return;
    const idx = dirs.indexOf(car.dir);
    car.dir = dirs[(idx + 1) % dirs.length];
    car.angle = car.dir === DIR.N ? -Math.PI/2 : car.dir === DIR.E ? 0 : car.dir === DIR.S ? Math.PI/2 : Math.PI;
    playSound('rotate');
    calculatePreviewPath();
    draw();
}

function resetLevel() {
    cancelAnimationFrame(animationId);
    clearInterval(countdownTimer);
    clearInterval(engineSoundInterval);
    stopPrepAnimation();
    $('orderReady').classList.add('hidden');
    retryLevel(); // Reintentar manteniendo la posición de la casa
}

// Función para reintentar el nivel manteniendo la posición de la casa
function retryLevel() {
    const config = LEVEL_CONFIG[Math.min(level - 1, 39)];
    gameState = 'EDITING';
    $('overlay').classList.add('hidden');
    $('btnStart').classList.remove('opacity-50', 'pointer-events-none');
    
    maxTime = config.time; timeLeft = maxTime;
    $('timerDisplay').textContent = `⏱️ ${timeLeft}`;
    $('timerDisplay').classList.remove('timer-warning');
    $('progressBar').style.width = '100%';
    $('progressBar').className = 'progress-bar h-full bg-emerald-500 rounded-full';
    $('statusText').textContent = 'PREPARANDO PEDIDO';
    $('statusText').className = 'text-yellow-400 font-bold text-xs';
    $('levelHint').textContent = `📦 Pedido #${level} | 👆 Prepara la ruta de entrega`;
    
    startPrepAnimation();
    
    resize();
    grid = new Array(COLS * ROWS).fill(null);
    specialTiles = [];
    
    placeStart();
    placeEnd(); // Usará la posición guardada porque el nivel no cambió
    placeObstacles(config.obstacles);
    fillEmpty(config.deadEnds);
    randomizeRotations();
    addSpecials(config.features);
    
    resetCar();
    checkConnections();
    draw();
    startCountdown();
}

function generateLevel() {
    const config = LEVEL_CONFIG[Math.min(level - 1, 39)];
    gameState = 'EDITING';
    $('overlay').classList.add('hidden');
    $('btnStart').classList.remove('opacity-50', 'pointer-events-none');
    
    // Si cambió el nivel, limpiar la posición guardada de la casa
    if (level !== currentLevelForEnd) {
        savedEndPosition = null;
        currentLevelForEnd = level;
    }
    
    maxTime = config.time; timeLeft = maxTime;
    $('timerDisplay').textContent = `⏱️ ${timeLeft}`;
    $('timerDisplay').classList.remove('timer-warning');
    $('progressBar').style.width = '100%';
    $('progressBar').className = 'progress-bar h-full bg-emerald-500 rounded-full';
    $('statusText').textContent = 'PREPARANDO PEDIDO';
    $('statusText').className = 'text-yellow-400 font-bold text-xs';
    $('levelHint').textContent = `📦 Pedido #${level} | 👆 Prepara la ruta de entrega`;
    
    // Mostrar animación de preparación
    startPrepAnimation();
    
    resize();
    grid = new Array(COLS * ROWS).fill(null);
    specialTiles = [];
    
    placeStart();
    placeEnd();
    placeObstacles(config.obstacles);
    fillEmpty(config.deadEnds);
    randomizeRotations();
    addSpecials(config.features);
    
    resetCar();
    checkConnections();
    draw();
    startCountdown();
}

function placeStart() {
    const positions = [
        { col: 0, row: 0 },
        { col: 0, row: Math.floor(ROWS / 2) },
        { col: Math.floor(COLS / 2), row: 0 }
    ];
    const pos = positions[level % positions.length];
    const tile = new Tile(pos.col, pos.row, TILE_TYPES.START);
    tile.locked = true;
    grid[pos.row * COLS + pos.col] = tile;
}

function placeEnd() {
    const startTile = grid.find(t => t && t.type === TILE_TYPES.START);
    
    let pos;
    
    // Si hay una posición guardada para este nivel, usarla
    if (savedEndPosition) {
        pos = savedEndPosition;
    } else {
        // Generar nueva posición y guardarla
        const positions = [
            { col: COLS - 1, row: ROWS - 1 },
            { col: COLS - 1, row: 0 },
            { col: 0, row: ROWS - 1 },
            { col: COLS - 1, row: Math.floor(ROWS / 2) }
        ].filter(p => Math.abs(p.col - startTile.col) + Math.abs(p.row - startTile.row) >= 3);
        
        pos = positions[Math.floor(Math.random() * positions.length)] || { col: COLS - 1, row: ROWS - 1 };
        savedEndPosition = { col: pos.col, row: pos.row }; // Guardar la posición
    }
    
    const tile = new Tile(pos.col, pos.row, TILE_TYPES.END);
    tile.locked = true;
    tile.isEnd = true;
    grid[pos.row * COLS + pos.col] = tile;
}

function placeObstacles(count) {
    let placed = 0, attempts = 0;
    while (placed < count && attempts < 200) {
        attempts++;
        const col = 1 + Math.floor(Math.random() * (COLS - 2));
        const row = 1 + Math.floor(Math.random() * (ROWS - 2));
        if (grid[row * COLS + col]) continue;
        
        grid[row * COLS + col] = new Tile(col, row, TILE_TYPES.BLOCKED);
        if (!canReachEnd()) { grid[row * COLS + col] = null; continue; }
        
        grid[row * COLS + col].special = ['broken', 'tree', 'construction'][Math.floor(Math.random() * 3)];
        placed++;
    }
}

function canReachEnd() {
    const startTile = grid.find(t => t && t.type === TILE_TYPES.START);
    const endTile = grid.find(t => t && t.type === TILE_TYPES.END);
    if (!startTile || !endTile) return true;
    
    const visited = new Set([`${startTile.col},${startTile.row}`]);
    const queue = [{ col: startTile.col, row: startTile.row }];
    
    while (queue.length > 0) {
        const curr = queue.shift();
        if (curr.col === endTile.col && curr.row === endTile.row) return true;
        
        [{dc:0,dr:-1}, {dc:1,dr:0}, {dc:0,dr:1}, {dc:-1,dr:0}].forEach(d => {
            const nc = curr.col + d.dc, nr = curr.row + d.dr;
            const key = `${nc},${nr}`;
            if (nc >= 0 && nc < COLS && nr >= 0 && nr < ROWS && !visited.has(key)) {
                const t = grid[nr * COLS + nc];
                if (!t || t.type !== TILE_TYPES.BLOCKED) {
                    visited.add(key);
                    queue.push({ col: nc, row: nr });
                }
            }
        });
    }
    return false;
}

function fillEmpty(deadEndCount) {
    const empty = [];
    for (let i = 0; i < COLS * ROWS; i++) if (!grid[i]) empty.push(i);
    empty.sort(() => Math.random() - 0.5);
    
    let deadPlaced = 0;
    const startTile = grid.find(t => t && t.type === TILE_TYPES.START);
    const endTile = grid.find(t => t && t.type === TILE_TYPES.END);
    
    for (let i = 0; i < empty.length; i++) {
        const idx = empty[i];
        const col = idx % COLS, row = Math.floor(idx / COLS);
        
        if (deadPlaced < deadEndCount && startTile && endTile) {
            const dStart = Math.abs(col - startTile.col) + Math.abs(row - startTile.row);
            const dEnd = Math.abs(col - endTile.col) + Math.abs(row - endTile.row);
            if (dStart >= 2 && dEnd >= 2) {
                const deadType = Math.random() > 0.5 ? TILE_TYPES.DEAD_STRAIGHT : TILE_TYPES.DEAD_CURVE;
                grid[idx] = new Tile(col, row, deadType);
                grid[idx].isDeadEnd = true;
                deadPlaced++;
                continue;
            }
        }
        
        const rand = Math.random();
        let type = rand < 0.35 ? TILE_TYPES.STRAIGHT : rand < 0.7 ? TILE_TYPES.CURVE : rand < 0.88 ? TILE_TYPES.T_JUNCTION : TILE_TYPES.CROSS;
        grid[idx] = new Tile(col, row, type);
    }
}

function randomizeRotations() {
    grid.forEach(tile => {
        if (tile && !tile.locked && tile.type !== TILE_TYPES.BLOCKED) {
            tile.rotation = Math.floor(Math.random() * 4);
        }
    });
}

function addSpecials(features) {
    if (!features.length) return;
    const eligible = [];
    grid.forEach((t, i) => { if (t && !t.locked && !t.special && t.type !== TILE_TYPES.BLOCKED) eligible.push(i); });
    eligible.sort(() => Math.random() - 0.5);
    
    let idx = 0;
    features.forEach(f => {
        for (let i = 0; i < 2 && idx < eligible.length; i++, idx++) {
            const tile = grid[eligible[idx]];
            if (f === 'semaphore') { tile.special = 'semaphore'; tile.semaphoreState = 'red'; specialTiles.push(tile); }
            else if (f === 'puddle') tile.special = 'puddle';
            else if (f === 'boost') tile.special = 'boost';
        }
    });
}

function checkConnections() {
    grid.forEach(t => { if (t) t.powered = false; });
    const start = grid.find(t => t && t.type === TILE_TYPES.START);
    if (!start) return;
    
    const queue = [start];
    start.powered = true;
    
    while (queue.length > 0) {
        const curr = queue.shift();
        const conn = curr.getConnections();
        
        [DIR.N, DIR.E, DIR.S, DIR.W].forEach(dir => {
            if (conn & dir) {
                const d = DIR_DELTA[dir];
                const nc = curr.col + d.dc, nr = curr.row + d.dr;
                if (nc >= 0 && nc < COLS && nr >= 0 && nr < ROWS) {
                    const neighbor = grid[nr * COLS + nc];
                    if (neighbor && !neighbor.powered && neighbor.type !== TILE_TYPES.BLOCKED) {
                        if (neighbor.getConnections() & OPPOSITE[dir]) {
                            neighbor.powered = true;
                            queue.push(neighbor);
                        }
                    }
                }
            }
        });
    }
    
    calculatePreviewPath();
}

function calculatePreviewPath() {
    previewPath = [];
    if (!car) return;
    
    let col = car.col, row = car.row, dir = car.dir;
    const visited = new Set();
    
    previewPath.push({ x: col * TILE_SIZE + TILE_SIZE / 2, y: row * TILE_SIZE + TILE_SIZE / 2 });
    
    for (let steps = 0; steps < 100; steps++) {
        const key = `${col},${row},${dir}`;
        if (visited.has(key)) break;
        visited.add(key);
        
        const tile = grid[row * COLS + col];
        if (!tile) break;
        
        if (tile.isEnd) {
            previewPath[previewPath.length - 1].isEnd = true;
            break;
        }
        
        const conn = tile.getConnections();
        const entry = OPPOSITE[dir];
        
        if (!tile.locked && !(conn & entry) && steps > 0) break;
        
        const exits = conn & ~entry;
        let exitDir = 0;
        
        if (exits & dir) exitDir = dir;
        else [DIR.N, DIR.E, DIR.S, DIR.W].forEach(d => { if (!exitDir && (exits & d)) exitDir = d; });
        
        if (!exitDir) break;
        
        const d = DIR_DELTA[exitDir];
        const nc = col + d.dc, nr = row + d.dr;
        
        if (nc < 0 || nc >= COLS || nr < 0 || nr >= ROWS) break;
        
        const next = grid[nr * COLS + nc];
        if (!next || next.type === TILE_TYPES.BLOCKED) break;
        if (!(next.getConnections() & OPPOSITE[exitDir])) break;
        
        previewPath.push({ x: nc * TILE_SIZE + TILE_SIZE / 2, y: nr * TILE_SIZE + TILE_SIZE / 2 });
        
        col = nc; row = nr; dir = exitDir;
    }
}

function startCountdown() {
    clearInterval(countdownTimer);
    countdownTimer = setInterval(() => {
        if (gameState !== 'EDITING') { clearInterval(countdownTimer); return; }
        timeLeft--;
        $('timerDisplay').textContent = `⏱️ ${timeLeft}`;
        $('progressBar').style.width = `${(timeLeft / maxTime) * 100}%`;
        
        if (timeLeft <= 5) {
            $('progressBar').className = 'progress-bar h-full bg-red-500 rounded-full';
            $('timerDisplay').classList.add('timer-warning');
            playSound('warning');
        } else if (timeLeft <= 10) {
            $('progressBar').className = 'progress-bar h-full bg-yellow-500 rounded-full';
        }
        
        // Actualizar barra de preparación (se llena mientras pasa el tiempo)
        const progress = ((maxTime - timeLeft) / maxTime) * 100;
        updatePrepBar(progress);
        
        if (timeLeft <= 0) {
            clearInterval(countdownTimer);
            updatePrepBar(100);
            setTimeout(() => {
                stopPrepAnimation();
                showOrderReady();
            }, 300);
        }
    }, 1000);
}

// Función para iniciar animación de preparación
function startPrepAnimation() {
    $('prepContainer').classList.remove('hidden');
    $('statusContainer').classList.add('hidden');
    $('orderReady').classList.add('hidden');
    $('prepBar').style.width = '0%';
    $('prepText').textContent = 'Preparando...';
}

// Función para actualizar la barra de preparación
function updatePrepBar(progress) {
    $('prepBar').style.width = progress + '%';
    
    if (progress < 30) {
        $('prepText').textContent = 'Preparando...';
    } else if (progress < 60) {
        $('prepText').textContent = 'Cocinando...';
    } else if (progress < 90) {
        $('prepText').textContent = 'Empacando...';
    } else {
        $('prepText').textContent = '¡Listo!';
    }
}

// Función para detener animación de preparación
function stopPrepAnimation() {
    $('prepContainer').classList.add('hidden');
    $('statusContainer').classList.remove('hidden');
}

// Función para mostrar mensaje de salida del pedido
function showOrderReady() {
    // Actualizar el emoji del vehículo en el mensaje
    $('orderVehicleEmoji').textContent = vehicleEmojis[selectedVehicle] || '🏍️';
    
    $('orderReady').classList.remove('hidden');
    $('statusText').textContent = '¡SALE EL PEDIDO!';
    $('statusText').className = 'text-emerald-400 font-bold text-xs pulse';
    
    playSound('win');
    
    // Después de mostrar el mensaje, iniciar el vehículo
    setTimeout(() => {
        $('orderReady').classList.add('hidden');
        actuallyStartCar();
    }, 1500);
}

function resetCar() {
    const start = grid.find(t => t && t.type === TILE_TYPES.START);
    if (!start) return;
    
    const conn = start.getConnections();
    let dir = DIR.E;
    [DIR.E, DIR.S, DIR.W, DIR.N].forEach(d => { if (conn & d) dir = d; });
    
    const config = LEVEL_CONFIG[Math.min(level - 1, 39)];
    car = {
        col: start.col, row: start.row,
        x: start.col * TILE_SIZE + TILE_SIZE / 2,
        y: start.row * TILE_SIZE + TILE_SIZE / 2,
        dir: dir,
        angle: dir === DIR.N ? -Math.PI/2 : dir === DIR.E ? 0 : dir === DIR.S ? Math.PI/2 : Math.PI,
        speed: config.speed, baseSpeed: config.speed, waiting: false
    };
    gameState = 'EDITING';
}

function startCar() {
    initAudio();
    if (gameState !== 'EDITING') return;
    clearInterval(countdownTimer);
    stopPrepAnimation();
    
    // Siempre mostrar el mensaje "Sale el pedido" al entregar
    showOrderReady();
}

function actuallyStartCar() {
    $('orderReady').classList.add('hidden');
    
    const start = grid[car.row * COLS + car.col];
    const conn = start.getConnections();
    if (!(conn & car.dir)) {
        [DIR.E, DIR.S, DIR.N, DIR.W].forEach(dir => { if (conn & dir) car.dir = dir; });
    }
    
    car.angle = car.dir === DIR.N ? -Math.PI/2 : car.dir === DIR.E ? 0 : car.dir === DIR.S ? Math.PI/2 : Math.PI;
    
    gameState = 'RUNNING';
    $('btnStart').classList.add('opacity-50', 'pointer-events-none');
    $('statusText').textContent = '¡ENTREGANDO!';
    $('statusText').className = 'text-emerald-400 font-bold text-xs';
    
    specialTiles.forEach(tile => {
        if (tile.special === 'semaphore') {
            const cycle = () => {
                if (gameState !== 'RUNNING') return;
                setTimeout(() => {
                    tile.semaphoreState = 'yellow'; draw();
                    setTimeout(() => {
                        tile.semaphoreState = 'green'; draw();
                        setTimeout(() => { tile.semaphoreState = 'red'; draw(); cycle(); }, 2500);
                    }, 800);
                }, 1500 + Math.random() * 1500);
            };
            cycle();
        }
    });
    
    engineSoundInterval = setInterval(() => {
        if (gameState === 'RUNNING' && !car.waiting) playSound('engine');
    }, 200);
    
    gameLoop();
}

function gameLoop() {
    if (gameState !== 'RUNNING') return;
    
    if (car.waiting) {
        const tile = grid[car.row * COLS + car.col];
        if (tile?.special === 'semaphore' && tile.semaphoreState === 'green') car.waiting = false;
        else { draw(); animationId = requestAnimationFrame(gameLoop); return; }
    }
    
    const cx = car.col * TILE_SIZE + TILE_SIZE / 2;
    const cy = car.row * TILE_SIZE + TILE_SIZE / 2;
    const dist = Math.sqrt((cx - car.x) ** 2 + (cy - car.y) ** 2);
    
    if (dist < 4) {
        car.x = cx; car.y = cy;
        const tile = grid[car.row * COLS + car.col];
        
        if (tile?.special === 'semaphore' && tile.semaphoreState !== 'green') {
            car.waiting = true; draw();
            animationId = requestAnimationFrame(gameLoop); return;
        }
        
        if (tile?.special === 'puddle') car.speed = car.baseSpeed * 0.5;
        else if (tile?.special === 'boost') car.speed = car.baseSpeed * 1.8;
        else car.speed = car.baseSpeed;
        
        // CUALQUIER meta es válida - ¡GANAS!
        if (tile?.isEnd) { win(); return; }
        
        const conn = tile?.getConnections() || 0;
        const entry = OPPOSITE[car.dir];
        
        if (!tile?.locked && !(conn & entry)) { crash('¡Sin entrada!'); return; }
        
        const exits = conn & ~entry;
        let exitDir = 0;
        
        if (exits & car.dir) exitDir = car.dir;
        else [DIR.N, DIR.E, DIR.S, DIR.W].forEach(d => { if (!exitDir && (exits & d)) exitDir = d; });
        
        if (!exitDir) { crash('¡Callejón sin salida!'); return; }
        
        const d = DIR_DELTA[exitDir];
        const nc = car.col + d.dc, nr = car.row + d.dr;
        
        if (nc < 0 || nc >= COLS || nr < 0 || nr >= ROWS) { crash('¡Fuera del mapa!'); return; }
        
        const next = grid[nr * COLS + nc];
        if (!next || next.type === TILE_TYPES.BLOCKED) { crash('¡Bloqueado!'); return; }
        if (!(next.getConnections() & OPPOSITE[exitDir])) { crash('¡Choque!'); return; }
        
        car.dir = exitDir; car.col = nc; car.row = nr;
        car.angle = exitDir === DIR.N ? -Math.PI/2 : exitDir === DIR.E ? 0 : exitDir === DIR.S ? Math.PI/2 : Math.PI;
    }
    
    const d = DIR_DELTA[car.dir];
    car.x += d.dc * car.speed; car.y += d.dr * car.speed;
    
    draw();
    animationId = requestAnimationFrame(gameLoop);
}

function crash(msg) {
    gameState = 'CRASHED';
    clearInterval(countdownTimer); clearInterval(engineSoundInterval);
    playSound('crash');
    $('gameContainer').classList.add('shake');
    setTimeout(() => $('gameContainer').classList.remove('shake'), 500);
    $('overlayIcon').textContent = '💥';
    $('overlayTitle').textContent = '¡CHOQUE!';
    $('overlaySubtitle').textContent = msg;
    $('overlayBonus').textContent = '🏠 El cliente aún espera su pedido...';
    $('overlayBtn').textContent = 'Reintentar';
    $('overlayBtn').onclick = retryLevel; // Reintentar mismo nivel, misma casa
    $('overlay').classList.remove('hidden');
}

function win() {
    gameState = 'WON';
    clearInterval(countdownTimer); clearInterval(engineSoundInterval);
    playSound('win');
    
    // Calcular propinas: tiempo restante * $5 + bonus por nivel
    const tipFromTime = timeLeft * 5;
    const levelBonus = level * 10;
    const totalTip = tipFromTime + levelBonus;
    totalMoney += totalTip;
    
    // Actualizar display de dinero
    $('moneyDisplay').textContent = totalMoney;
    
    $('overlayIcon').textContent = '🎉📦';
    $('overlayTitle').textContent = '¡ENTREGA #' + level + ' COMPLETADA!';
    $('overlaySubtitle').textContent = `⭐⭐⭐⭐⭐ ¡Excelente servicio!`;
    $('overlayBonus').innerHTML = `<span class="block">⏱️ Tiempo: ${timeLeft}s = $${tipFromTime}</span><span class="block">🌟 Bonus: $${levelBonus}</span><span class="block text-lg mt-1">💰 Propina: $${totalTip}</span>`;
    $('overlayBtn').textContent = level >= 40 ? 'Reiniciar' : 'Siguiente Pedido';
    $('overlayBtn').onclick = () => {
        if (level >= 40) level = 0;
        level++;
        $('levelDisplay').textContent = level;
        generateLevel();
    };
    $('overlay').classList.remove('hidden');
}

function draw() {
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    grid.forEach(t => { if (t) drawTile(t); });
    
    if (gameState === 'EDITING' && previewPath.length > 1) {
        drawPreviewPath();
    }
    
    if (car) drawCar();
}

function drawPreviewPath() {
    ctx.save();
    
    // Sombra
    ctx.strokeStyle = 'rgba(0, 0, 0, 0.4)';
    ctx.lineWidth = 6;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.setLineDash([8, 4]);
    ctx.beginPath();
    ctx.moveTo(previewPath[0].x, previewPath[0].y);
    for (let i = 1; i < previewPath.length; i++) {
        ctx.lineTo(previewPath[i].x, previewPath[i].y);
    }
    ctx.stroke();
    
    // Línea principal amarilla
    ctx.strokeStyle = 'rgba(251, 191, 36, 0.9)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(previewPath[0].x, previewPath[0].y);
    for (let i = 1; i < previewPath.length; i++) {
        ctx.lineTo(previewPath[i].x, previewPath[i].y);
    }
    ctx.stroke();
    ctx.setLineDash([]);
    
    // Indicador final
    const last = previewPath[previewPath.length - 1];
    if (last.isEnd) {
        ctx.fillStyle = 'rgba(34, 197, 94, 0.8)';
        ctx.beginPath();
        ctx.arc(last.x, last.y, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'white';
        ctx.lineWidth = 2;
        ctx.stroke();
    } else {
        ctx.strokeStyle = 'rgba(239, 68, 68, 0.9)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(last.x - 6, last.y - 6);
        ctx.lineTo(last.x + 6, last.y + 6);
        ctx.moveTo(last.x + 6, last.y - 6);
        ctx.lineTo(last.x - 6, last.y + 6);
        ctx.stroke();
    }
    
    ctx.restore();
}

function drawTile(tile) {
    const x = tile.col * TILE_SIZE, y = tile.row * TILE_SIZE;
    const cx = x + TILE_SIZE / 2, cy = y + TILE_SIZE / 2;
    const rw = TILE_SIZE * 0.45, h = rw / 2;
    
    ctx.save();
    ctx.fillStyle = '#334155';
    ctx.fillRect(x + 1, y + 1, TILE_SIZE - 2, TILE_SIZE - 2);
    
    if (tile.type === TILE_TYPES.BLOCKED) {
        ctx.fillStyle = tile.special === 'tree' ? '#166534' : tile.special === 'broken' ? '#4b5563' : '#ea580c';
        ctx.fillRect(x + 4, y + 4, TILE_SIZE - 8, TILE_SIZE - 8);
        ctx.font = `${TILE_SIZE * 0.4}px sans-serif`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(tile.special === 'tree' ? '🌳' : tile.special === 'broken' ? '⚠️' : '🚧', cx, cy);
        ctx.restore(); return;
    }
    
    ctx.translate(cx, cy);
    ctx.rotate(tile.rotation * Math.PI / 2);
    
    let color = tile.isDeadEnd ? (tile.powered ? '#65a30d' : '#525252') : 
                tile.type === TILE_TYPES.START ? '#10b981' : 
                tile.powered ? '#4ade80' : '#64748b';
    
    ctx.fillStyle = color;
    const conn = tile.type.base, s = TILE_SIZE;
    
    if (conn & DIR.N) ctx.fillRect(-h, -s/2, rw, s/2 + h);
    if (conn & DIR.S) ctx.fillRect(-h, -h, rw, s/2 + h);
    if (conn & DIR.E) ctx.fillRect(-h, -h, s/2 + h, rw);
    if (conn & DIR.W) ctx.fillRect(-s/2, -h, s/2 + h, rw);
    
    ctx.beginPath(); ctx.arc(0, 0, h, 0, Math.PI * 2); ctx.fill();
    
    if (!tile.isDeadEnd && !tile.type.noArrows) {
        ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 1.5; ctx.setLineDash([3, 2]);
        if ((conn & DIR.N) && (conn & DIR.S)) { ctx.beginPath(); ctx.moveTo(0, -s/2); ctx.lineTo(0, s/2); ctx.stroke(); }
        if ((conn & DIR.E) && (conn & DIR.W)) { ctx.beginPath(); ctx.moveTo(-s/2, 0); ctx.lineTo(s/2, 0); ctx.stroke(); }
        ctx.setLineDash([]);
    }
    
    if (tile.type === TILE_TYPES.START) {
        ctx.fillStyle = 'white'; ctx.font = 'bold 9px sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('GO', 0, 0);
    }
    
    ctx.restore();
    
    // Meta - bandera MÁS GRANDE Y VISIBLE
    if (tile.isEnd) {
        // Fondo circular brillante pulsante
        const glowColor = tile.powered ? 'rgba(34, 197, 94, 0.5)' : 'rgba(100, 116, 139, 0.3)';
        ctx.fillStyle = glowColor;
        ctx.beginPath();
        ctx.arc(cx, cy, TILE_SIZE * 0.4, 0, Math.PI * 2);
        ctx.fill();
        
        // Círculo interior
        ctx.fillStyle = tile.powered ? 'rgba(16, 185, 129, 0.8)' : 'rgba(71, 85, 105, 0.6)';
        ctx.beginPath();
        ctx.arc(cx, cy, TILE_SIZE * 0.3, 0, Math.PI * 2);
        ctx.fill();
        
        // Borde brillante
        ctx.strokeStyle = tile.powered ? '#4ade80' : '#94a3b8';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(cx, cy, TILE_SIZE * 0.35, 0, Math.PI * 2);
        ctx.stroke();
        
        // Casa del cliente
        ctx.font = `${TILE_SIZE * 0.55}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.shadowColor = 'rgba(0,0,0,0.5)';
        ctx.shadowBlur = 4;
        ctx.fillText('🏠', cx, cy - 2);
        ctx.shadowBlur = 0;
        
        // Texto "CLIENTE" debajo
        ctx.fillStyle = tile.powered ? '#ffffff' : '#94a3b8';
        ctx.font = `bold ${TILE_SIZE * 0.14}px sans-serif`;
        ctx.fillText('CLIENTE', cx, cy + TILE_SIZE * 0.32);
    }
    
    if (tile.isDeadEnd) {
        ctx.fillStyle = 'rgba(255, 200, 0, 0.4)';
        ctx.font = `${TILE_SIZE * 0.25}px sans-serif`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('?', cx, cy);
    }
    
    // ...existing code para especiales (semaphore, puddle, boost)...
    if (tile.special === 'semaphore') {
        ctx.fillStyle = '#1f2937'; ctx.fillRect(cx - 4, cy - 10, 8, 20);
        const cols = { red: tile.semaphoreState === 'red' ? '#ef4444' : '#3f1515', yellow: tile.semaphoreState === 'yellow' ? '#fbbf24' : '#3f3515', green: tile.semaphoreState === 'green' ? '#22c55e' : '#153f25' };
        ctx.beginPath(); ctx.arc(cx, cy - 6, 2.5, 0, Math.PI * 2); ctx.fillStyle = cols.red; ctx.fill();
        ctx.beginPath(); ctx.arc(cx, cy, 2.5, 0, Math.PI * 2); ctx.fillStyle = cols.yellow; ctx.fill();
        ctx.beginPath(); ctx.arc(cx, cy + 6, 2.5, 0, Math.PI * 2); ctx.fillStyle = cols.green; ctx.fill();
    } else if (tile.special === 'puddle') {
        ctx.fillStyle = 'rgba(59, 130, 246, 0.5)';
        ctx.beginPath(); ctx.ellipse(cx, cy, TILE_SIZE * 0.12, TILE_SIZE * 0.08, 0, 0, Math.PI * 2); ctx.fill();
    } else if (tile.special === 'boost') {
        ctx.font = `${TILE_SIZE * 0.22}px sans-serif`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('⚡', cx, cy);
    }
}

function drawCar() {

    ctx.rotate(car.angle);

        // Rueda trasera con detalles
        ctx.fillStyle = '#1a1a1a';
        ctx.beginPath(); ctx.arc(-7, 4, 5, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#4b5563';
        ctx.beginPath(); ctx.arc(-7, 4, 3, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#9ca3af';
        ctx.beginPath(); ctx.arc(-7, 4, 1.5, 0, Math.PI * 2); ctx.fill();
        
        // Rueda delantera con detalles

        ctx.fillStyle = '#4b5563';
        ctx.beginPath(); ctx.arc(9, 4, 3, 0, Math.PI * 2); ctx.fill();

        ctx.font = 'bold 4px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('🚗', 0, 2);
        
        // Parachoques
        ctx.fillStyle = '#374151';

    } else if (selectedVehicle === 'truck') {

        ctx.beginPath(); ctx.arc(-9, 6, 1.5, 0, Math.PI * 2); ctx.fill();

        ctx.beginPath(); ctx.arc(9, 6, 5, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#4b5563';
        ctx.beginPath(); ctx.arc(9, 6, 3, 0, Math.PI * 2); ctx.fill();

        ctx.strokeRect(-15, -7, 14, 12);
        // Líneas de la caja
        ctx.beginPath();
        ctx.moveTo(-15, -2);
        ctx.lineTo(-1, -2);
        ctx.moveTo(-8, -7);
        ctx.lineTo(-8, 5);
        ctx.stroke();
        
        // Cabina
        ctx.fillStyle = waiting ? '#6b7280' : mainColor;
        ctx.beginPath(); ctx.roundRect(0, -6, 14, 12, 3); ctx.fill();
        
        // Ventana de cabina
        ctx.fillStyle = '#1e3a5f';
        ctx.beginPath(); ctx.roundRect(2, -5, 8, 6, 2); ctx.fill();
        
        // Espejo retrovisor
        ctx.fillStyle = '#374151';
        ctx.fillRect(0, -3, 2, 4);
        
        // Luces delanteras
        ctx.fillStyle = waiting ? '#6b7280' : '#fef08a';
        ctx.beginPath(); ctx.roundRect(12, -2, 3, 3, 1); ctx.fill();
        ctx.beginPath(); ctx.roundRect(12, 2, 3, 2, 1); ctx.fill();
        
        // Luces traseras
        ctx.fillStyle = '#dc2626';
        ctx.beginPath(); ctx.roundRect(-17, 0, 2, 4, 1); ctx.fill();
        
        // Parrilla
        ctx.fillStyle = '#1f2937';
        ctx.beginPath(); ctx.roundRect(13, -1, 2, 5, 1); ctx.fill();
    } else if (selectedVehicle === 'bus') {
        // Bus de reparto mejorado

        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.beginPath(); ctx.ellipse(0, 11, 16, 4, 0, 0, Math.PI * 2); ctx.fill();
        
        // Ruedas traseras
        ctx.fillStyle = '#1a1a1a';
        ctx.beginPath(); ctx.arc(-11, 7, 5, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#4b5563';
        ctx.beginPath(); ctx.arc(-11, 7, 3, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#6b7280';
        ctx.beginPath(); ctx.arc(-11, 7, 1.5, 0, Math.PI * 2); ctx.fill();
        
        // Ruedas delanteras
        ctx.fillStyle = '#1a1a1a';
        ctx.beginPath(); ctx.arc(11, 7, 5, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#4b5563';
        ctx.beginPath(); ctx.arc(11, 7, 3, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#6b7280';
        ctx.beginPath(); ctx.arc(11, 7, 1.5, 0, Math.PI * 2); ctx.fill();
        
        // Cuerpo principal del bus
        ctx.fillStyle = waiting ? '#6b7280' : mainColor;
        ctx.beginPath(); ctx.roundRect(-18, -8, 36, 16, 4); ctx.fill();
        
        // Franja de empresa
        ctx.fillStyle = companyColor;
        ctx.fillRect(-18, -2, 36, 4);
        
        // Ventanas superiores
        ctx.fillStyle = '#1e3a5f';
        for (let i = 0; i < 5; i++) {
            ctx.beginPath(); ctx.roundRect(-15 + i * 7, -7, 5, 4, 1); ctx.fill();
        }
        
        // Ventanas inferiores
        for (let i = 0; i < 5; i++) {
            ctx.beginPath(); ctx.roundRect(-15 + i * 7, 3, 5, 4, 1); ctx.fill();
        }
        
        // Puerta
        ctx.fillStyle = '#374151';
        ctx.beginPath(); ctx.roundRect(14, -6, 4, 12, 1); ctx.fill();
        ctx.fillStyle = '#1e3a5f';
        ctx.beginPath(); ctx.roundRect(15, -5, 2, 10, 1); ctx.fill();
        
        // Luces delanteras
        ctx.fillStyle = waiting ? '#6b7280' : '#fef08a';
        ctx.beginPath(); ctx.roundRect(16, -7, 3, 3, 1); ctx.fill();
        ctx.fillStyle = '#f97316';
        ctx.beginPath(); ctx.roundRect(16, 5, 3, 2, 1); ctx.fill();
        
        // Luces traseras
        ctx.fillStyle = '#dc2626';
        ctx.beginPath(); ctx.roundRect(-19, -5, 2, 4, 1); ctx.fill();
        ctx.beginPath(); ctx.roundRect(-19, 3, 2, 3, 1); ctx.fill();
        
        // Espejo lateral
        ctx.fillStyle = '#374151';
        ctx.fillRect(18, -4, 2, 3);
        
        // Letrero de destino
        ctx.fillStyle = '#000000';
        ctx.beginPath(); ctx.roundRect(-10, -10, 20, 3, 1); ctx.fill();
        ctx.fillStyle = '#fef08a';
        ctx.font = 'bold 3px sans-serif';

        ctx.fillText('DELIVERY', 0, -8);
    }
    
    // Indicador de dirección en modo edición
    if (gameState === 'EDITING') {
        ctx.fillStyle = 'rgba(74, 222, 128, 0.8)';
        ctx.beginPath();
        const offset = selectedVehicle === 'bus' ? 24 : selectedVehicle === 'truck' ? 20 : selectedVehicle === 'moto' ? 18 : 16;
        ctx.moveTo(offset + 6, 0);
        ctx.lineTo(offset - 2, -5);
        ctx.lineTo(offset - 2, 5);
        ctx.closePath();
        ctx.fill();
        
        ctx.strokeStyle = 'rgba(74, 222, 128, 0.5)';
        ctx.lineWidth = 2;
        ctx.setLineDash([3, 3]);
        const radius = selectedVehicle === 'bus' ? 24 : selectedVehicle === 'truck' ? 22 : selectedVehicle === 'moto' ? 18 : 16;
        ctx.beginPath();
        ctx.arc(0, 0, radius, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);
    }
    
    ctx.restore();
}

// Función auxiliar para oscurecer colores
function shadeColor(color, percent) {
    const num = parseInt(color.replace('#', ''), 16);
    const amt = Math.round(2.55 * percent);
    const R = Math.max(0, Math.min(255, (num >> 16) + amt));
    const G = Math.max(0, Math.min(255, (num >> 8 & 0x00FF) + amt));
    const B = Math.max(0, Math.min(255, (num & 0x0000FF) + amt));
    return '#' + (0x1000000 + R * 0x10000 + G * 0x100 + B).toString(16).slice(1);
}
