<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RunCar - Puzzle de Carreteras</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            touch-action: manipulation;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
            overflow: hidden;
            user-select: none;
        }
        canvas {
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            border-radius: 10px;
            background-color: #1e293b;
            border: 2px solid #334155;
            cursor: pointer;
        }
        .btn-game { transition: all 0.1s; -webkit-tap-highlight-color: transparent; }
        .btn-game:active { transform: scale(0.95); }
        .shake { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-5px, 0, 0); }
            40%, 60% { transform: translate3d(5px, 0, 0); }
        }
        .pulse { animation: pulse 0.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .timer-warning { animation: timerPulse 0.5s infinite; color: #ef4444 !important; }
        @keyframes timerPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        .progress-bar { transition: width 1s linear; }
        input[type="text"] {
            background: #1e293b; border: 2px solid #475569; color: white;
            padding: 12px 16px; border-radius: 10px; font-size: 18px;
            width: 100%; max-width: 280px; text-align: center;
        }
        input[type="text"]:focus { outline: none; border-color: #10b981; }
        ::-webkit-scrollbar { display: none; }
        .vehicle-btn { transition: all 0.2s; border: 3px solid transparent; }
        .vehicle-btn.selected { border-color: #10b981; transform: scale(1.1); }
        .color-btn { width: 32px; height: 32px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; }
        .color-btn.selected { border-color: white; transform: scale(1.15); }
    </style>
</head>
<body class="h-screen w-screen flex flex-col items-center justify-center overflow-hidden">

    <!-- PANTALLA DE INICIO -->
    <div id="startScreen" class="absolute inset-0 bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 flex flex-col items-center justify-center z-50 p-4 overflow-y-auto">
        <div class="text-center py-4">
            <div class="text-5xl mb-3">🚗</div>
            <h1 class="text-3xl font-bold text-emerald-400 mb-1">RunCar</h1>
            <p class="text-slate-400 mb-4 text-sm">Puzzle de Carreteras</p>
            
            <div class="mb-4">
                <label class="block text-slate-300 mb-2 text-sm">Nombre del conductor:</label>
                <input type="text" id="driverName" placeholder="Tu nombre" maxlength="15" autocomplete="off">
            </div>
            
            <!-- Selector de Vehículo -->
            <div class="mb-4">
                <label class="block text-slate-300 mb-2 text-sm">Elige tu vehículo:</label>
                <div class="flex justify-center gap-3">
                    <button onclick="selectVehicle('car')" id="btn-car" class="vehicle-btn selected bg-slate-700 p-3 rounded-xl">
                        <span class="text-3xl">🚗</span>
                        <p class="text-xs mt-1">Carro</p>
                    </button>
                    <button onclick="selectVehicle('truck')" id="btn-truck" class="vehicle-btn bg-slate-700 p-3 rounded-xl">
                        <span class="text-3xl">🛻</span>
                        <p class="text-xs mt-1">Camioneta</p>
                    </button>
                    <button onclick="selectVehicle('bus')" id="btn-bus" class="vehicle-btn bg-slate-700 p-3 rounded-xl">
                        <span class="text-3xl">🚌</span>
                        <p class="text-xs mt-1">Bus</p>
                    </button>
                </div>
            </div>
            
            <!-- Selector de Color -->
            <div class="mb-5">
                <label class="block text-slate-300 mb-2 text-sm">Color del vehículo:</label>
                <div class="flex justify-center gap-2 flex-wrap max-w-xs mx-auto">
                    <button onclick="selectColor('#f472b6')" class="color-btn selected" style="background: #f472b6;" id="color-pink"></button>
                    <button onclick="selectColor('#ef4444')" class="color-btn" style="background: #ef4444;" id="color-red"></button>
                    <button onclick="selectColor('#f97316')" class="color-btn" style="background: #f97316;" id="color-orange"></button>
                    <button onclick="selectColor('#eab308')" class="color-btn" style="background: #eab308;" id="color-yellow"></button>
                    <button onclick="selectColor('#22c55e')" class="color-btn" style="background: #22c55e;" id="color-green"></button>
                    <button onclick="selectColor('#3b82f6')" class="color-btn" style="background: #3b82f6;" id="color-blue"></button>
                    <button onclick="selectColor('#8b5cf6')" class="color-btn" style="background: #8b5cf6;" id="color-purple"></button>
                    <button onclick="selectColor('#ffffff')" class="color-btn" style="background: #ffffff;" id="color-white"></button>
                </div>
            </div>
            
            <button onclick="startGame()" class="btn-game bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-10 rounded-xl text-lg shadow-lg border-b-4 border-emerald-800">
                🏁 JUGAR
            </button>
            
            <div class="mt-4 text-slate-500 text-xs max-w-xs">
                <p>Gira las fichas para armar el camino.<br>
                👆 Toca el vehículo para elegir dirección.<br>
                🟡 La línea muestra la ruta.</p>
            </div>
        </div>
    </div>

    <!-- Header -->
    <div class="absolute top-0 w-full p-2 flex justify-between items-center pointer-events-none z-10">
        <div class="bg-slate-800/95 px-3 py-1.5 rounded-lg border border-slate-600 shadow-lg">
            <p class="text-emerald-400 font-bold text-sm"><span id="vehicleIcon">🚗</span> <span id="driverDisplay">Conductor</span></p>
            <p class="text-xs text-slate-400">Nivel <span id="levelDisplay">1</span>/40</p>
        </div>
        <div class="bg-slate-800/95 px-3 py-1.5 rounded-lg border border-slate-600 shadow-lg flex flex-col items-center">
            <span id="statusText" class="text-yellow-400 font-bold text-xs">GIRA LAS FICHAS</span>
            <div class="w-24 h-1.5 bg-slate-700 rounded-full mt-1 overflow-hidden">
                <div id="progressBar" class="progress-bar h-full bg-emerald-500 rounded-full" style="width: 100%"></div>
            </div>
        </div>
        <div class="bg-slate-800/95 px-3 py-1.5 rounded-lg border border-slate-600 shadow-lg">
            <span id="timerDisplay" class="text-blue-400 font-bold text-lg">⏱️ 30</span>
        </div>
    </div>

    <!-- Game Area -->
    <div class="relative p-1" id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <div id="overlay" class="hidden absolute inset-0 bg-black/90 flex flex-col items-center justify-center z-20 rounded-xl p-4">
            <div class="text-6xl mb-3 animate-bounce" id="overlayIcon">🏆</div>
            <h2 class="text-2xl font-bold mb-1 text-white text-center" id="overlayTitle"></h2>
            <p class="text-slate-300 text-sm mb-1 text-center" id="overlaySubtitle"></p>
            <p class="text-yellow-400 text-xs mb-4" id="overlayBonus"></p>
            <button id="overlayBtn" class="bg-emerald-500 hover:bg-emerald-400 text-white font-bold py-3 px-8 rounded-full shadow-lg btn-game">Siguiente</button>
        </div>
    </div>

    <!-- Hint -->
    <div class="text-center text-slate-400 text-xs mt-1 px-4">
        <p id="levelHint">Arma el camino hacia la meta 🏁</p>
    </div>

    <!-- Controls -->
    <div class="absolute bottom-3 w-full flex justify-center gap-2 px-3 z-10">
        <button onclick="resetLevel()" class="btn-game bg-slate-600 hover:bg-slate-500 text-white p-3 rounded-xl shadow-lg border-b-4 border-slate-800">🔄</button>
        <button onclick="startCar()" id="btnStart" class="btn-game bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-8 rounded-xl text-base shadow-lg border-b-4 border-emerald-800">🚗 ARRANCAR</button>
        <button onclick="toggleSound()" class="btn-game bg-blue-600 hover:bg-blue-500 text-white p-3 rounded-xl shadow-lg border-b-4 border-blue-800"><span id="soundIcon">🔊</span></button>
        <button onclick="showMenu()" class="btn-game bg-purple-600 hover:bg-purple-500 text-white p-3 rounded-xl shadow-lg border-b-4 border-purple-800">☰</button>
    </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Variables de personalización del vehículo
let selectedVehicle = 'car';
let selectedColor = '#f472b6';

function selectVehicle(type) {
    selectedVehicle = type;
    document.querySelectorAll('.vehicle-btn').forEach(btn => btn.classList.remove('selected'));
    document.getElementById('btn-' + type).classList.add('selected');
}

function selectColor(color) {
    selectedColor = color;
    document.querySelectorAll('.color-btn').forEach(btn => btn.classList.remove('selected'));
    // Encontrar y marcar el botón correcto
    document.querySelectorAll('.color-btn').forEach(btn => {
        if (btn.style.background === color || btn.style.backgroundColor === color) {
            btn.classList.add('selected');
        }
    });
}

let audioCtx = null, soundEnabled = true;
function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
function playSound(type) {
    if (!soundEnabled || !audioCtx) return;
    try {
        const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        const t = audioCtx.currentTime;
        if (type === 'rotate') { osc.frequency.setValueAtTime(600, t); osc.frequency.exponentialRampToValueAtTime(300, t + 0.08); gain.gain.setValueAtTime(0.08, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.08); osc.start(t); osc.stop(t + 0.08); }
        else if (type === 'engine') { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(80, t); gain.gain.setValueAtTime(0.04, t); osc.start(t); osc.stop(t + 0.12); }
        else if (type === 'crash') { osc.type = 'square'; osc.frequency.setValueAtTime(150, t); osc.frequency.exponentialRampToValueAtTime(40, t + 0.3); gain.gain.setValueAtTime(0.2, t); osc.start(t); osc.stop(t + 0.3); }
        else if (type === 'win') { [523,659,784,1047].forEach((f,i) => { const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.connect(g); g.connect(audioCtx.destination); o.frequency.setValueAtTime(f, t+i*0.15); g.gain.setValueAtTime(0.1, t+i*0.15); o.start(t+i*0.15); o.stop(t+i*0.15+0.2); }); }
        else if (type === 'warning') { osc.frequency.setValueAtTime(400, t); gain.gain.setValueAtTime(0.1, t); osc.start(t); osc.stop(t + 0.1); }
    } catch(e) {}
}
function toggleSound() { soundEnabled = !soundEnabled; document.getElementById('soundIcon').textContent = soundEnabled ? '🔊' : '🔇'; }

// Configuración de niveles - MAPAS MÁS GRANDES
const LEVEL_CONFIG = [];
for (let i = 1; i <= 40; i++) {
    LEVEL_CONFIG.push({
        cols: Math.min(5 + Math.floor(i / 4), 9),
        rows: Math.min(6 + Math.floor(i / 3), 11),
        time: 45 + i * 3,
        speed: 2.0 + i * 0.08,
        obstacles: Math.min(Math.floor(i / 5), 5),
        deadEnds: Math.min(2 + Math.floor(i / 4), 8),
        features: i >= 10 ? (i >= 18 ? (i >= 26 ? ['semaphore','puddle','boost'] : ['semaphore','puddle']) : ['semaphore']) : []
    });
}

let TILE_SIZE = 55, COLS = 6, ROWS = 7;
const DIR = { N: 1, E: 2, S: 4, W: 8 };
const DIR_DELTA = { 1: {dc:0,dr:-1}, 2: {dc:1,dr:0}, 4: {dc:0,dr:1}, 8: {dc:-1,dr:0} };
const OPPOSITE = { 1: 4, 2: 8, 4: 1, 8: 2 };

// Tipos de tiles - TODAS las metas son válidas
const TILE_TYPES = {
    STRAIGHT: { id: 1, base: DIR.N | DIR.S },
    CURVE: { id: 2, base: DIR.N | DIR.E },
    T_JUNCTION: { id: 3, base: DIR.N | DIR.E | DIR.S },
    CROSS: { id: 4, base: DIR.N | DIR.E | DIR.S | DIR.W },
    START: { id: 5, base: DIR.N | DIR.E | DIR.S | DIR.W, locked: true },
    END: { id: 6, base: DIR.N | DIR.E | DIR.S | DIR.W, locked: true }, // Una sola meta con múltiples entradas
    BLOCKED: { id: 7, base: 0, locked: true },
    // Calles trampa - transitables pero SIN flechas (confunden)
    DEAD_STRAIGHT: { id: 8, base: DIR.N | DIR.S, noArrows: true },
    DEAD_CURVE: { id: 9, base: DIR.N | DIR.E, noArrows: true }
};

let grid = [], specialTiles = [], car = null, level = 1, driverName = "Conductor";
let gameState = 'START', animationId, countdownTimer, timeLeft, maxTime, engineSoundInterval;

const $ = id => document.getElementById(id);

class Tile {
    constructor(col, row, type, rotation = 0) {
        this.col = col; this.row = row; this.type = type;
        this.rotation = rotation; this.locked = type.locked || false;
        this.powered = false; this.special = null; this.semaphoreState = 'red';
        this.isEnd = false; this.isDeadEnd = false;
    }
    getConnections() {
        if (this.type === TILE_TYPES.BLOCKED) return 0;
        let conn = this.type.base;
        for (let i = 0; i < this.rotation; i++) {
            let n = 0;
            if (conn & DIR.N) n |= DIR.E;
            if (conn & DIR.E) n |= DIR.S;
            if (conn & DIR.S) n |= DIR.W;
            if (conn & DIR.W) n |= DIR.N;
            conn = n;
        }
        return conn;
    }
}

function startGame() {
    initAudio();
    driverName = $('driverName').value.trim() || "Conductor";
    $('driverDisplay').textContent = driverName;
    $('vehicleIcon').textContent = selectedVehicle === 'car' ? '🚗' : selectedVehicle === 'truck' ? '🛻' : '🚌';
    $('startScreen').classList.add('hidden');
    level = 1; $('levelDisplay').textContent = level;
    generateLevel();
}

function showMenu() {
    if (confirm('¿Volver al menú?')) {
        cancelAnimationFrame(animationId);
        clearInterval(countdownTimer);
        clearInterval(engineSoundInterval);
        $('startScreen').classList.remove('hidden');
        gameState = 'START';
    }
}

function init() {
    resize();
    window.addEventListener('resize', () => { if (gameState !== 'START') { resize(); draw(); } });
    canvas.addEventListener('pointerdown', handleClick);
}

function resize() {
    const config = LEVEL_CONFIG[Math.min(level - 1, 39)];
    COLS = config.cols; ROWS = config.rows;
    const maxW = innerWidth - 16, maxH = innerHeight - 160;
    TILE_SIZE = Math.min(Math.floor(maxW / COLS), Math.floor(maxH / ROWS), 60);
    canvas.width = COLS * TILE_SIZE; canvas.height = ROWS * TILE_SIZE;
}

function handleClick(e) {
    initAudio();
    if (gameState !== 'EDITING') return;
    const rect = canvas.getBoundingClientRect();
    const clickX = e.clientX - rect.left, clickY = e.clientY - rect.top;
    
    if (car) {
        const carDist = Math.sqrt((clickX - car.x) ** 2 + (clickY - car.y) ** 2);
        if (carDist < TILE_SIZE * 0.5) { rotateCar(); return; }
    }
    
    const col = Math.floor(clickX / TILE_SIZE), row = Math.floor(clickY / TILE_SIZE);
    if (col >= 0 && col < COLS && row >= 0 && row < ROWS) {
        const tile = grid[row * COLS + col];
        if (tile && !tile.locked && tile.type !== TILE_TYPES.BLOCKED) {
            tile.rotation = (tile.rotation + 1) % 4;
            playSound('rotate');
            checkConnections();
            draw();
        }
    }
}

function rotateCar() {
    if (!car || gameState !== 'EDITING') return;
    const start = grid[car.row * COLS + car.col];
    if (!start) return;
    const conn = start.getConnections();
    const dirs = [DIR.N, DIR.E, DIR.S, DIR.W].filter(d => conn & d);
    if (dirs.length <= 1) return;
    const idx = dirs.indexOf(car.dir);
    car.dir = dirs[(idx + 1) % dirs.length];
    car.angle = car.dir === DIR.N ? -Math.PI/2 : car.dir === DIR.E ? 0 : car.dir === DIR.S ? Math.PI/2 : Math.PI;
    playSound('rotate');
    calculatePreviewPath();
    draw();
}

function resetLevel() {
    cancelAnimationFrame(animationId);
    clearInterval(countdownTimer);
    clearInterval(engineSoundInterval);
    generateLevel();
}

function generateLevel() {
    const config = LEVEL_CONFIG[Math.min(level - 1, 39)];
    gameState = 'EDITING';
    $('overlay').classList.add('hidden');
    $('btnStart').classList.remove('opacity-50', 'pointer-events-none');
    
    maxTime = config.time; timeLeft = maxTime;
    $('timerDisplay').textContent = `⏱️ ${timeLeft}`;
    $('timerDisplay').classList.remove('timer-warning');
    $('progressBar').style.width = '100%';
    $('progressBar').className = 'progress-bar h-full bg-emerald-500 rounded-full';
    $('statusText').textContent = 'GIRA LAS FICHAS';
    $('statusText').className = 'text-yellow-400 font-bold text-xs';
    $('levelHint').textContent = `🏁 Nivel ${level} | 👆 Toca el vehículo para girar`;
    
    resize();
    grid = new Array(COLS * ROWS).fill(null);
    specialTiles = [];
    
    placeStart();
    placeEnd();
    placeObstacles(config.obstacles);
    fillEmpty(config.deadEnds);
    randomizeRotations();
    addSpecials(config.features);
    
    resetCar();
    checkConnections();
    draw();
    startCountdown();
}

function placeStart() {
    const positions = [
        { col: 0, row: 0 },
        { col: 0, row: Math.floor(ROWS / 2) },
        { col: Math.floor(COLS / 2), row: 0 }
    ];
    const pos = positions[level % positions.length];
    const tile = new Tile(pos.col, pos.row, TILE_TYPES.START);
    tile.locked = true;
    grid[pos.row * COLS + pos.col] = tile;
}

function placeEnd() {
    const startTile = grid.find(t => t && t.type === TILE_TYPES.START);
    const positions = [
        { col: COLS - 1, row: ROWS - 1 },
        { col: COLS - 1, row: 0 },
        { col: 0, row: ROWS - 1 },
        { col: COLS - 1, row: Math.floor(ROWS / 2) }
    ].filter(p => Math.abs(p.col - startTile.col) + Math.abs(p.row - startTile.row) >= 3);
    
    const pos = positions[Math.floor(Math.random() * positions.length)] || { col: COLS - 1, row: ROWS - 1 };
    const tile = new Tile(pos.col, pos.row, TILE_TYPES.END);
    tile.locked = true;
    tile.isEnd = true;
    grid[pos.row * COLS + pos.col] = tile;
}

function placeObstacles(count) {
    let placed = 0, attempts = 0;
    while (placed < count && attempts < 200) {
        attempts++;
        const col = 1 + Math.floor(Math.random() * (COLS - 2));
        const row = 1 + Math.floor(Math.random() * (ROWS - 2));
        if (grid[row * COLS + col]) continue;
        
        grid[row * COLS + col] = new Tile(col, row, TILE_TYPES.BLOCKED);
        if (!canReachEnd()) { grid[row * COLS + col] = null; continue; }
        
        grid[row * COLS + col].special = ['broken', 'tree', 'construction'][Math.floor(Math.random() * 3)];
        placed++;
    }
}

function canReachEnd() {
    const startTile = grid.find(t => t && t.type === TILE_TYPES.START);
    const endTile = grid.find(t => t && t.type === TILE_TYPES.END);
    if (!startTile || !endTile) return true;
    
    const visited = new Set([`${startTile.col},${startTile.row}`]);
    const queue = [{ col: startTile.col, row: startTile.row }];
    
    while (queue.length > 0) {
        const curr = queue.shift();
        if (curr.col === endTile.col && curr.row === endTile.row) return true;
        
        [{dc:0,dr:-1}, {dc:1,dr:0}, {dc:0,dr:1}, {dc:-1,dr:0}].forEach(d => {
            const nc = curr.col + d.dc, nr = curr.row + d.dr;
            const key = `${nc},${nr}`;
            if (nc >= 0 && nc < COLS && nr >= 0 && nr < ROWS && !visited.has(key)) {
                const t = grid[nr * COLS + nc];
                if (!t || t.type !== TILE_TYPES.BLOCKED) {
                    visited.add(key);
                    queue.push({ col: nc, row: nr });
                }
            }
        });
    }
    return false;
}

function fillEmpty(deadEndCount) {
    const empty = [];
    for (let i = 0; i < COLS * ROWS; i++) if (!grid[i]) empty.push(i);
    empty.sort(() => Math.random() - 0.5);
    
    let deadPlaced = 0;
    const startTile = grid.find(t => t && t.type === TILE_TYPES.START);
    const endTile = grid.find(t => t && t.type === TILE_TYPES.END);
    
    for (let i = 0; i < empty.length; i++) {
        const idx = empty[i];
        const col = idx % COLS, row = Math.floor(idx / COLS);
        
        if (deadPlaced < deadEndCount && startTile && endTile) {
            const dStart = Math.abs(col - startTile.col) + Math.abs(row - startTile.row);
            const dEnd = Math.abs(col - endTile.col) + Math.abs(row - endTile.row);
            if (dStart >= 2 && dEnd >= 2) {
                const deadType = Math.random() > 0.5 ? TILE_TYPES.DEAD_STRAIGHT : TILE_TYPES.DEAD_CURVE;
                grid[idx] = new Tile(col, row, deadType);
                grid[idx].isDeadEnd = true;
                deadPlaced++;
                continue;
            }
        }
        
        const rand = Math.random();
        let type = rand < 0.35 ? TILE_TYPES.STRAIGHT : rand < 0.7 ? TILE_TYPES.CURVE : rand < 0.88 ? TILE_TYPES.T_JUNCTION : TILE_TYPES.CROSS;
        grid[idx] = new Tile(col, row, type);
    }
}

function randomizeRotations() {
    grid.forEach(tile => {
        if (tile && !tile.locked && tile.type !== TILE_TYPES.BLOCKED) {
            tile.rotation = Math.floor(Math.random() * 4);
        }
    });
}

function addSpecials(features) {
    if (!features.length) return;
    const eligible = [];
    grid.forEach((t, i) => { if (t && !t.locked && !t.special && t.type !== TILE_TYPES.BLOCKED) eligible.push(i); });
    eligible.sort(() => Math.random() - 0.5);
    
    let idx = 0;
    features.forEach(f => {
        for (let i = 0; i < 2 && idx < eligible.length; i++, idx++) {
            const tile = grid[eligible[idx]];
            if (f === 'semaphore') { tile.special = 'semaphore'; tile.semaphoreState = 'red'; specialTiles.push(tile); }
            else if (f === 'puddle') tile.special = 'puddle';
            else if (f === 'boost') tile.special = 'boost';
        }
    });
}

function checkConnections() {
    grid.forEach(t => { if (t) t.powered = false; });
    const start = grid.find(t => t && t.type === TILE_TYPES.START);
    if (!start) return;
    
    const queue = [start];
    start.powered = true;
    
    while (queue.length > 0) {
        const curr = queue.shift();
        const conn = curr.getConnections();
        
        [DIR.N, DIR.E, DIR.S, DIR.W].forEach(dir => {
            if (conn & dir) {
                const d = DIR_DELTA[dir];
                const nc = curr.col + d.dc, nr = curr.row + d.dr;
                if (nc >= 0 && nc < COLS && nr >= 0 && nr < ROWS) {
                    const neighbor = grid[nr * COLS + nc];
                    if (neighbor && !neighbor.powered && neighbor.type !== TILE_TYPES.BLOCKED) {
                        if (neighbor.getConnections() & OPPOSITE[dir]) {
                            neighbor.powered = true;
                            queue.push(neighbor);
                        }
                    }
                }
            }
        });
    }
    
    calculatePreviewPath();
}

function calculatePreviewPath() {
    previewPath = [];
    if (!car) return;
    
    let col = car.col, row = car.row, dir = car.dir;
    const visited = new Set();
    
    previewPath.push({ x: col * TILE_SIZE + TILE_SIZE / 2, y: row * TILE_SIZE + TILE_SIZE / 2 });
    
    for (let steps = 0; steps < 100; steps++) {
        const key = `${col},${row},${dir}`;
        if (visited.has(key)) break;
        visited.add(key);
        
        const tile = grid[row * COLS + col];
        if (!tile) break;
        
        if (tile.isEnd) {
            previewPath[previewPath.length - 1].isEnd = true;
            break;
        }
        
        const conn = tile.getConnections();
        const entry = OPPOSITE[dir];
        
        if (!tile.locked && !(conn & entry) && steps > 0) break;
        
        const exits = conn & ~entry;
        let exitDir = 0;
        
        if (exits & dir) exitDir = dir;
        else [DIR.N, DIR.E, DIR.S, DIR.W].forEach(d => { if (!exitDir && (exits & d)) exitDir = d; });
        
        if (!exitDir) break;
        
        const d = DIR_DELTA[exitDir];
        const nc = col + d.dc, nr = row + d.dr;
        
        if (nc < 0 || nc >= COLS || nr < 0 || nr >= ROWS) break;
        
        const next = grid[nr * COLS + nc];
        if (!next || next.type === TILE_TYPES.BLOCKED) break;
        if (!(next.getConnections() & OPPOSITE[exitDir])) break;
        
        previewPath.push({ x: nc * TILE_SIZE + TILE_SIZE / 2, y: nr * TILE_SIZE + TILE_SIZE / 2 });
        
        col = nc; row = nr; dir = exitDir;
    }
}

function startCountdown() {
    clearInterval(countdownTimer);
    countdownTimer = setInterval(() => {
        if (gameState !== 'EDITING') { clearInterval(countdownTimer); return; }
        timeLeft--;
        $('timerDisplay').textContent = `⏱️ ${timeLeft}`;
        $('progressBar').style.width = `${(timeLeft / maxTime) * 100}%`;
        
        if (timeLeft <= 5) {
            $('progressBar').className = 'progress-bar h-full bg-red-500 rounded-full';
            $('timerDisplay').classList.add('timer-warning');
            playSound('warning');
        } else if (timeLeft <= 10) {
            $('progressBar').className = 'progress-bar h-full bg-yellow-500 rounded-full';
        }
        
        if (timeLeft <= 0) {
            clearInterval(countdownTimer);
            $('statusText').textContent = '¡TIEMPO!';
            $('statusText').className = 'text-red-400 font-bold text-xs pulse';
            setTimeout(startCar, 500);
        }
    }, 1000);
}

function resetCar() {
    const start = grid.find(t => t && t.type === TILE_TYPES.START);
    if (!start) return;
    
    const conn = start.getConnections();
    let dir = DIR.E;
    [DIR.E, DIR.S, DIR.W, DIR.N].forEach(d => { if (conn & d) dir = d; });
    
    const config = LEVEL_CONFIG[Math.min(level - 1, 39)];
    car = {
        col: start.col, row: start.row,
        x: start.col * TILE_SIZE + TILE_SIZE / 2,
        y: start.row * TILE_SIZE + TILE_SIZE / 2,
        dir: dir,
        angle: dir === DIR.N ? -Math.PI/2 : dir === DIR.E ? 0 : dir === DIR.S ? Math.PI/2 : Math.PI,
        speed: config.speed, baseSpeed: config.speed, waiting: false
    };
    gameState = 'EDITING';
}

function startCar() {
    initAudio();
    if (gameState !== 'EDITING') return;
    clearInterval(countdownTimer);
    
    const start = grid[car.row * COLS + car.col];
    const conn = start.getConnections();
    if (!(conn & car.dir)) {
        [DIR.E, DIR.S, DIR.N, DIR.W].forEach(dir => { if (conn & dir) car.dir = dir; });
    }
    
    car.angle = car.dir === DIR.N ? -Math.PI/2 : car.dir === DIR.E ? 0 : car.dir === DIR.S ? Math.PI/2 : Math.PI;
    
    gameState = 'RUNNING';
    $('btnStart').classList.add('opacity-50', 'pointer-events-none');
    $('statusText').textContent = '¡EN MARCHA!';
    $('statusText').className = 'text-emerald-400 font-bold text-xs';
    
    specialTiles.forEach(tile => {
        if (tile.special === 'semaphore') {
            const cycle = () => {
                if (gameState !== 'RUNNING') return;
                setTimeout(() => {
                    tile.semaphoreState = 'yellow'; draw();
                    setTimeout(() => {
                        tile.semaphoreState = 'green'; draw();
                        setTimeout(() => { tile.semaphoreState = 'red'; draw(); cycle(); }, 2500);
                    }, 800);
                }, 1500 + Math.random() * 1500);
            };
            cycle();
        }
    });
    
    engineSoundInterval = setInterval(() => {
        if (gameState === 'RUNNING' && !car.waiting) playSound('engine');
    }, 200);
    
    gameLoop();
}

function gameLoop() {
    if (gameState !== 'RUNNING') return;
    
    if (car.waiting) {
        const tile = grid[car.row * COLS + car.col];
        if (tile?.special === 'semaphore' && tile.semaphoreState === 'green') car.waiting = false;
        else { draw(); animationId = requestAnimationFrame(gameLoop); return; }
    }
    
    const cx = car.col * TILE_SIZE + TILE_SIZE / 2;
    const cy = car.row * TILE_SIZE + TILE_SIZE / 2;
    const dist = Math.sqrt((cx - car.x) ** 2 + (cy - car.y) ** 2);
    
    if (dist < 4) {
        car.x = cx; car.y = cy;
        const tile = grid[car.row * COLS + car.col];
        
        if (tile?.special === 'semaphore' && tile.semaphoreState !== 'green') {
            car.waiting = true; draw();
            animationId = requestAnimationFrame(gameLoop); return;
        }
        
        if (tile?.special === 'puddle') car.speed = car.baseSpeed * 0.5;
        else if (tile?.special === 'boost') car.speed = car.baseSpeed * 1.8;
        else car.speed = car.baseSpeed;
        
        // CUALQUIER meta es válida - ¡GANAS!
        if (tile?.isEnd) { win(); return; }
        
        const conn = tile?.getConnections() || 0;
        const entry = OPPOSITE[car.dir];
        
        if (!tile?.locked && !(conn & entry)) { crash('¡Sin entrada!'); return; }
        
        const exits = conn & ~entry;
        let exitDir = 0;
        
        if (exits & car.dir) exitDir = car.dir;
        else [DIR.N, DIR.E, DIR.S, DIR.W].forEach(d => { if (!exitDir && (exits & d)) exitDir = d; });
        
        if (!exitDir) { crash('¡Callejón sin salida!'); return; }
        
        const d = DIR_DELTA[exitDir];
        const nc = car.col + d.dc, nr = car.row + d.dr;
        
        if (nc < 0 || nc >= COLS || nr < 0 || nr >= ROWS) { crash('¡Fuera del mapa!'); return; }
        
        const next = grid[nr * COLS + nc];
        if (!next || next.type === TILE_TYPES.BLOCKED) { crash('¡Bloqueado!'); return; }
        if (!(next.getConnections() & OPPOSITE[exitDir])) { crash('¡Choque!'); return; }
        
        car.dir = exitDir; car.col = nc; car.row = nr;
        car.angle = exitDir === DIR.N ? -Math.PI/2 : exitDir === DIR.E ? 0 : exitDir === DIR.S ? Math.PI/2 : Math.PI;
    }
    
    const d = DIR_DELTA[car.dir];
    car.x += d.dc * car.speed; car.y += d.dr * car.speed;
    
    draw();
    animationId = requestAnimationFrame(gameLoop);
}

function crash(msg) {
    gameState = 'CRASHED';
    clearInterval(countdownTimer); clearInterval(engineSoundInterval);
    playSound('crash');
    $('gameContainer').classList.add('shake');
    setTimeout(() => $('gameContainer').classList.remove('shake'), 500);
    $('overlayIcon').textContent = '💥';
    $('overlayTitle').textContent = '¡CHOQUE!';
    $('overlaySubtitle').textContent = msg;
    $('overlayBonus').textContent = '';
    $('overlayBtn').textContent = 'Reintentar';
    $('overlayBtn').onclick = resetLevel;
    $('overlay').classList.remove('hidden');
}

function win() {
    gameState = 'WON';
    clearInterval(countdownTimer); clearInterval(engineSoundInterval);
    playSound('win');
    const bonus = timeLeft * 10 + level * 25;
    
    $('overlayIcon').textContent = '🏆';
    $('overlayTitle').textContent = '¡NIVEL ' + level + '!';
    $('overlaySubtitle').textContent = `Tiempo: ${timeLeft}s`;
    $('overlayBonus').textContent = `+${bonus} pts`;
    $('overlayBtn').textContent = level >= 40 ? 'Reiniciar' : 'Siguiente';
    $('overlayBtn').onclick = () => {
        if (level >= 40) level = 0;
        level++;
        $('levelDisplay').textContent = level;
        generateLevel();
    };
    $('overlay').classList.remove('hidden');
}

function draw() {
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    grid.forEach(t => { if (t) drawTile(t); });
    
    if (gameState === 'EDITING' && previewPath.length > 1) {
        drawPreviewPath();
    }
    
    if (car) drawCar();
}

function drawPreviewPath() {
    ctx.save();
    
    // Sombra
    ctx.strokeStyle = 'rgba(0, 0, 0, 0.4)';
    ctx.lineWidth = 6;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.setLineDash([8, 4]);
    ctx.beginPath();
    ctx.moveTo(previewPath[0].x, previewPath[0].y);
    for (let i = 1; i < previewPath.length; i++) {
        ctx.lineTo(previewPath[i].x, previewPath[i].y);
    }
    ctx.stroke();
    
    // Línea principal amarilla
    ctx.strokeStyle = 'rgba(251, 191, 36, 0.9)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(previewPath[0].x, previewPath[0].y);
    for (let i = 1; i < previewPath.length; i++) {
        ctx.lineTo(previewPath[i].x, previewPath[i].y);
    }
    ctx.stroke();
    ctx.setLineDash([]);
    
    // Indicador final
    const last = previewPath[previewPath.length - 1];
    if (last.isEnd) {
        ctx.fillStyle = 'rgba(34, 197, 94, 0.8)';
        ctx.beginPath();
        ctx.arc(last.x, last.y, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'white';
        ctx.lineWidth = 2;
        ctx.stroke();
    } else {
        ctx.strokeStyle = 'rgba(239, 68, 68, 0.9)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(last.x - 6, last.y - 6);
        ctx.lineTo(last.x + 6, last.y + 6);
        ctx.moveTo(last.x + 6, last.y - 6);
        ctx.lineTo(last.x - 6, last.y + 6);
        ctx.stroke();
    }
    
    ctx.restore();
}

function drawTile(tile) {
    const x = tile.col * TILE_SIZE, y = tile.row * TILE_SIZE;
    const cx = x + TILE_SIZE / 2, cy = y + TILE_SIZE / 2;
    const rw = TILE_SIZE * 0.45, h = rw / 2;
    
    ctx.save();
    ctx.fillStyle = '#334155';
    ctx.fillRect(x + 1, y + 1, TILE_SIZE - 2, TILE_SIZE - 2);
    
    if (tile.type === TILE_TYPES.BLOCKED) {
        ctx.fillStyle = tile.special === 'tree' ? '#166534' : tile.special === 'broken' ? '#4b5563' : '#ea580c';
        ctx.fillRect(x + 4, y + 4, TILE_SIZE - 8, TILE_SIZE - 8);
        ctx.font = `${TILE_SIZE * 0.4}px sans-serif`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(tile.special === 'tree' ? '🌳' : tile.special === 'broken' ? '⚠️' : '🚧', cx, cy);
        ctx.restore(); return;
    }
    
    ctx.translate(cx, cy);
    ctx.rotate(tile.rotation * Math.PI / 2);
    
    let color = tile.isDeadEnd ? (tile.powered ? '#65a30d' : '#525252') : 
                tile.type === TILE_TYPES.START ? '#10b981' : 
                tile.powered ? '#4ade80' : '#64748b';
    
    ctx.fillStyle = color;
    const conn = tile.type.base, s = TILE_SIZE;
    
    if (conn & DIR.N) ctx.fillRect(-h, -s/2, rw, s/2 + h);
    if (conn & DIR.S) ctx.fillRect(-h, -h, rw, s/2 + h);
    if (conn & DIR.E) ctx.fillRect(-h, -h, s/2 + h, rw);
    if (conn & DIR.W) ctx.fillRect(-s/2, -h, s/2 + h, rw);
    
    ctx.beginPath(); ctx.arc(0, 0, h, 0, Math.PI * 2); ctx.fill();
    
    if (!tile.isDeadEnd && !tile.type.noArrows) {
        ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 1.5; ctx.setLineDash([3, 2]);
        if ((conn & DIR.N) && (conn & DIR.S)) { ctx.beginPath(); ctx.moveTo(0, -s/2); ctx.lineTo(0, s/2); ctx.stroke(); }
        if ((conn & DIR.E) && (conn & DIR.W)) { ctx.beginPath(); ctx.moveTo(-s/2, 0); ctx.lineTo(s/2, 0); ctx.stroke(); }
        ctx.setLineDash([]);
    }
    
    if (tile.type === TILE_TYPES.START) {
        ctx.fillStyle = 'white'; ctx.font = 'bold 9px sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('GO', 0, 0);
    }
    
    ctx.restore();
    
    if (tile.isEnd) {
        ctx.font = `${TILE_SIZE * 0.35}px sans-serif`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('🏁', cx, cy);
    }
    
    if (tile.isDeadEnd) {
        ctx.fillStyle = 'rgba(255, 200, 0, 0.4)';
        ctx.font = `${TILE_SIZE * 0.25}px sans-serif`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('?', cx, cy);
    }
    
    if (tile.special === 'semaphore') {
        ctx.fillStyle = '#1f2937'; ctx.fillRect(cx - 4, cy - 10, 8, 20);
        const cols = { red: tile.semaphoreState === 'red' ? '#ef4444' : '#3f1515', yellow: tile.semaphoreState === 'yellow' ? '#fbbf24' : '#3f3515', green: tile.semaphoreState === 'green' ? '#22c55e' : '#153f25' };
        ctx.beginPath(); ctx.arc(cx, cy - 6, 2.5, 0, Math.PI * 2); ctx.fillStyle = cols.red; ctx.fill();
        ctx.beginPath(); ctx.arc(cx, cy, 2.5, 0, Math.PI * 2); ctx.fillStyle = cols.yellow; ctx.fill();
        ctx.beginPath(); ctx.arc(cx, cy + 6, 2.5, 0, Math.PI * 2); ctx.fillStyle = cols.green; ctx.fill();
    } else if (tile.special === 'puddle') {
        ctx.fillStyle = 'rgba(59, 130, 246, 0.5)';
        ctx.beginPath(); ctx.ellipse(cx, cy, TILE_SIZE * 0.12, TILE_SIZE * 0.08, 0, 0, Math.PI * 2); ctx.fill();
    } else if (tile.special === 'boost') {
        ctx.font = `${TILE_SIZE * 0.22}px sans-serif`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('⚡', cx, cy);
    }
}

function drawCar() {
    ctx.save();
    ctx.translate(car.x, car.y);
    ctx.rotate(car.angle);
    ctx.shadowColor = 'rgba(0,0,0,0.4)'; ctx.shadowBlur = 5;
    
    const mainColor = selectedColor;
    const darkColor = shadeColor(selectedColor, -30);
    const waiting = car.waiting;
    
    if (selectedVehicle === 'car') {
        // Carro compacto
        ctx.fillStyle = waiting ? '#94a3b8' : mainColor;
        ctx.beginPath(); ctx.roundRect(-10, -6, 20, 12, 3); ctx.fill();
        ctx.fillStyle = waiting ? '#64748b' : darkColor;
        ctx.beginPath(); ctx.roundRect(-5, -4, 8, 8, 2); ctx.fill();
        ctx.fillStyle = '#1e293b'; ctx.fillRect(-3, -3, 5, 6);
        ctx.fillStyle = waiting ? '#94a3b8' : '#fef08a';
        ctx.fillRect(8, -3, 2, 2); ctx.fillRect(8, 1, 2, 2);
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(-7, -8, 4, 2); ctx.fillRect(-7, 6, 4, 2);
        ctx.fillRect(3, -8, 4, 2); ctx.fillRect(3, 6, 4, 2);
    } else if (selectedVehicle === 'truck') {
        // Camioneta
        ctx.fillStyle = waiting ? '#94a3b8' : mainColor;
        ctx.beginPath(); ctx.roundRect(-14, -7, 28, 14, 3); ctx.fill();
        ctx.fillStyle = waiting ? '#64748b' : darkColor;
        ctx.beginPath(); ctx.roundRect(-12, -5, 10, 10, 2); ctx.fill();
        ctx.fillStyle = '#1e293b'; ctx.fillRect(-10, -4, 6, 8);
        ctx.fillStyle = '#475569';
        ctx.fillRect(0, -5, 12, 10);
        ctx.fillStyle = waiting ? '#94a3b8' : '#fef08a';
        ctx.fillRect(12, -3, 2, 2); ctx.fillRect(12, 1, 2, 2);
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(-11, -9, 5, 2); ctx.fillRect(-11, 7, 5, 2);
        ctx.fillRect(6, -9, 5, 2); ctx.fillRect(6, 7, 5, 2);
    } else if (selectedVehicle === 'bus') {
        // Bus
        ctx.fillStyle = waiting ? '#94a3b8' : mainColor;
        ctx.beginPath(); ctx.roundRect(-16, -8, 32, 16, 4); ctx.fill();
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(-12, -6, 5, 5); ctx.fillRect(-4, -6, 5, 5); ctx.fillRect(4, -6, 5, 5);
        ctx.fillRect(-12, 1, 5, 5); ctx.fillRect(-4, 1, 5, 5); ctx.fillRect(4, 1, 5, 5);
        ctx.fillStyle = waiting ? '#64748b' : darkColor;
        ctx.fillRect(10, -6, 5, 12);
        ctx.fillStyle = waiting ? '#94a3b8' : '#fef08a';
        ctx.fillRect(14, -4, 2, 3); ctx.fillRect(14, 1, 2, 3);
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(-13, -10, 6, 2); ctx.fillRect(-13, 8, 6, 2);
        ctx.fillRect(7, -10, 6, 2); ctx.fillRect(7, 8, 6, 2);
    }
    
    // Indicador de dirección en modo edición
    if (gameState === 'EDITING') {
        ctx.fillStyle = 'rgba(74, 222, 128, 0.8)';
        ctx.beginPath();
        const offset = selectedVehicle === 'bus' ? 22 : selectedVehicle === 'truck' ? 18 : 14;
        ctx.moveTo(offset + 6, 0);
        ctx.lineTo(offset - 2, -5);
        ctx.lineTo(offset - 2, 5);
        ctx.closePath();
        ctx.fill();
        
        ctx.strokeStyle = 'rgba(74, 222, 128, 0.5)';
        ctx.lineWidth = 2;
        ctx.setLineDash([3, 3]);
        const radius = selectedVehicle === 'bus' ? 20 : selectedVehicle === 'truck' ? 18 : 14;
        ctx.beginPath();
        ctx.arc(0, 0, radius, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);
    }
    
    ctx.restore();
}

// Función auxiliar para oscurecer colores
function shadeColor(color, percent) {
    const num = parseInt(color.replace('#', ''), 16);
    const amt = Math.round(2.55 * percent);
    const R = Math.max(0, Math.min(255, (num >> 16) + amt));
    const G = Math.max(0, Math.min(255, (num >> 8 & 0x00FF) + amt));
    const B = Math.max(0, Math.min(255, (num & 0x0000FF) + amt));
    return '#' + (0x1000000 + R * 0x10000 + G * 0x100 + B).toString(16).slice(1);
}

window.onload = init;
</script>
